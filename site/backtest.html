<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>/* 在 body 渲染前就套用主題，避免切換時閃一下白底 */
(function(){try{var t=localStorage.getItem('theme');
if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/style.css">
<title>回測報告</title>
</head><body>
<div class="wrap" id="app"></div>
<script src="assets/app.js"></script>
<script>
/* 回測報告：穩定強勢股名單（stable/backtest.json，RESEARCH_LOG 第 11 輪）。
 *
 * 讀法寫在頁面上：2008–2026 的資料已經被前 10 輪研究看過很多次，
 * 回測只能當「淘汰關卡」—— 過不了就不該信，過了也不代表有效。 */
function pp(v) { return v == null ? '—' : App.num(v, 1) + '%'; }
function pt(v) { return v == null ? '—' : '<span class="' + App.cls(v) + '">' + App.num(v, 1, true) + '</span>'; }
function tt(v) { return v == null ? '' : '<br><span class="mut" style="font-size:12px">t ' + App.num(v, 2) + '</span>'; }

function periodTable(B) {
  var rows = Object.keys(B.periods).map(function (k) { return [k, B.periods[k]]; });
  rows.push(['2008–2025 合計', B.all]);
  return '<div class="scroll"><table><thead><tr><th>期間</th><th>訊號日</th>' +
    '<th>名單 ' + App.tip('中') + '／' + App.tip('倒') + '</th><th>' + App.tip('穩定池') + ' 中／倒</th>' +
    '<th class="sorted">多出的' + App.tip('中減倒') + '</th><th>對「波動相同」的隨機</th><th>每 10 天取一天</th>' +
    '<th>第 10 天平均漲跌<br>名單／池</th></tr></thead><tbody>' +
    rows.map(function (x) {
      var s = x[1];
      if (!s) return '<tr><td>' + x[0] + '</td><td colspan="7" class="mut">沒有資料</td></tr>';
      return '<tr><td>' + x[0] + (x[0] === '2026' ? '<br><span class="mut" style="font-size:12px">只看一次</span>' : '') + '</td>' +
        '<td>' + s.days.toLocaleString() + '</td>' +
        '<td>' + pp(s.hit) + '／' + pp(s.fail) + '</td><td class="mut">' + pp(s.pool_hit) + '／' + pp(s.pool_fail) + '</td>' +
        '<td class="sorted">' + pt(s.diff) + tt(s.t) + '</td><td>' + pt(s.diff_c2) + tt(s.t_c2) + '</td>' +
        '<td>' + pt(s.diff_sub) + tt(s.t_sub) + '</td>' +
        '<td>' + App.pct(s.r10, 2) + '／' + App.pct(s.pool_r10, 2) + '</td></tr>';
    }).join('') + '</tbody></table></div>';
}

function controls(B) {
  var a = B.all || {};
  var L = [['名單（前 10 檔）', a.net],
           ['穩定池隨便挑', a.c1], ['穩定池、波動相同的隨機', a.c2],
           ['穩定池裡 20 日漲最多的 10 檔', a.c3], ['穩定池裡波動最大的 10 檔', a.c4],
           ['排除之前（成交額前 300 名）隨便挑', a.c5]];
  return '<div class="scroll"><table><thead><tr><th style="text-align:left">挑法（2008–2025）</th><th class="sorted">中減倒</th></tr></thead><tbody>' +
    L.map(function (x, i) {
      return '<tr><td style="text-align:left">' + (i === 0 ? '<b>' + x[0] + '</b>' : x[0]) + '</td><td class="sorted">' + pt(x[1]) + '</td></tr>';
    }).join('') + '</tbody></table></div>';
}

function exclTable(B) {
  return '<div class="scroll"><table><thead><tr><th style="text-align:left">排除規則</th><th>每天平均刷掉</th>' +
    '<th>被刷掉那批的中</th><th>被刷掉那批的倒</th></tr></thead><tbody>' +
    B.exclusions.map(function (e) {
      var strong = e.key === 'kept' || e.key === 'all';
      return '<tr><td style="text-align:left">' + (strong ? '<b>' + App.esc(e.name) + '</b>' : App.esc(e.name)) + '</td>' +
        '<td>' + App.num(e.per_day, 1) + ' 檔</td><td>' + pp(e.hit) + '</td><td>' + pp(e.fail) + '</td></tr>';
    }).join('') + '</tbody></table></div>';
}

function yearTable(B) {
  return '<div class="scroll" data-per="20"><table><thead><tr><th>年</th><th>訊號日</th><th>名單 中／倒</th>' +
    '<th>穩定池 中／倒</th><th class="sorted">多出的中減倒</th></tr></thead><tbody>' +
    B.years.slice().reverse().map(function (y) {
      return '<tr><td>' + y.year + '</td><td>' + y.days + '</td><td>' + pp(y.hit) + '／' + pp(y.fail) + '</td>' +
        '<td class="mut">' + pp(y.pool_hit) + '／' + pp(y.pool_fail) + '</td><td class="sorted">' + pt(y.diff) + '</td></tr>';
    }).join('') + '</tbody></table></div>';
}

function sensTable(B) {
  return '<div class="scroll"><table><thead><tr><th style="text-align:left">改一個設定</th><th>名單 中／倒</th>' +
    '<th class="sorted">多出的中減倒（2008–2025）</th></tr></thead><tbody>' +
    [{ label: '現在的設定', all: B.all }].concat(B.sensitivity).map(function (s) {
      var a = s.all || {};
      return '<tr><td style="text-align:left">' + App.esc(s.label) + '</td><td>' + pp(a.hit) + '／' + pp(a.fail) + '</td>' +
        '<td class="sorted">' + pt(a.diff) + tt(a.t) + '</td></tr>';
    }).join('') + '</tbody></table></div>';
}

function recentTable(B) {
  return '<div class="scroll" data-per="20"><table><thead><tr><th>名單日期</th><th>檔數</th><th>名單 中／倒</th>' +
    '<th>穩定池 中／倒</th><th class="sorted">多出的中減倒</th></tr></thead><tbody>' +
    B.recent.map(function (r) {
      return '<tr><td>' + r.date + '</td><td>' + r.n + '</td><td>' + pp(r.hit) + '／' + pp(r.fail) + '</td>' +
        '<td class="mut">' + pp(r.pool_hit) + '／' + pp(r.pool_fail) + '</td><td class="sorted">' + pt(r.diff) + '</td></tr>';
    }).join('') + '</tbody></table></div>';
}

App.boot('backtest', function (meta) {
  return App.get('stable/backtest.json').then(function (B) {
    var a = B.all || {};
    var verdict = B.passed
      ? '<b>通過淘汰關卡</b>：兩段期間名單都比穩定池隨便挑好、也比「波動相同的隨機」好，合計 t ' + App.num(a.t, 1) + '（門檻 3）。' +
        '但這些年份的資料之前已經被研究過很多次，通過只代表「跟歷史不矛盾」，不代表有效 —— 真正的成績看<a href="history.html">名單成績</a>。'
      : '<b>沒有通過淘汰關卡</b>（事前寫好的標準：兩段期間都要比穩定池好、合計 t ≥ 3、也要比波動相同的隨機好）。名單照常列出，但請當成參考。';
    document.getElementById('app').innerHTML =
      '<h1 style="font-size:30px;letter-spacing:-.03em;font-weight:500;margin:0 0 4px">回測報告</h1>' +
      '<div class="meta">穩定強勢股名單 ｜ 資料到 ' + App.esc(B.date) + ' ｜ 訊號日 ' + (a.start || '') + ' ~ ' + (a.end || '') + '</div>' +
      '<div class="statusbar ' + (B.passed ? 'ok' : 'warn') + '"><span class="txt">' + verdict + '</span></div>' +
      '<div class="card"><h2>一句話</h2>' +
      '<p style="font-size:17px;line-height:1.7;margin:0">過去 18 年，名單每 10 檔平均約 <b>' + App.num(a.hit / 10, 1) + ' 檔</b>在 10 個交易日內收盤漲到 5%，' +
      '約 ' + App.num(a.fail / 10, 1) + ' 檔先跌到 −5%。從同一個穩定池隨便挑，是 ' + App.num(a.pool_hit / 10, 1) + ' 檔對 ' +
      App.num(a.pool_fail / 10, 1) + ' 檔。</p>' +
      '<p class="note">也就是說，名單比隨便挑多中了大約 ' + App.num(a.hit - a.pool_hit, 1) + ' 個百分點，倒的只多 ' +
      App.num(a.fail - a.pool_fail, 1) + ' 個。差距是真的（不像運氣），但不大。</p></div>' +
      '<div class="card"><h2>分期間看</h2>' +
      '<p class="lead">「多出的中減倒」是主要的判斷依據：名單的（中 − 倒）減掉同一天穩定池的（中 − 倒），單位是百分點。' +
      '每一天算一個數字再平均，t 值有考慮相鄰幾天的名單會重疊。</p>' + periodTable(B) + '</div>' +
      '<div class="card"><h2>跟其他挑法比</h2>' +
      '<p class="lead">如果名單只是剛好挑到波動比較大的股票，「波動相同的隨機」就會跟它一樣好；如果只是追漲，「20 日漲最多」就會一樣好。' +
      '兩個都比名單差，代表排序真的有用到別的東西。</p>' + controls(B) + '</div>' +
      '<div class="card"><h2>排除規則的代價</h2>' +
      '<p class="lead">被刷掉的股票，中的比例其實比較高，但倒的比例更高 —— 排除規則就是拿「比較不會中」換「比較不會倒」，' +
      '這是你要的「穩定」，不是預測能力。</p>' + exclTable(B) + '</div>' +
      '<div class="card"><h2>每一年</h2>' + yearTable(B) + '</div>' +
      '<div class="card"><h2>換個設定會怎樣</h2>' +
      '<p class="lead">只是記錄，不拿來挑設定 —— 看了結果再換成最好看的那組，就是在背答案。方向都一樣，代表結果不是剛好卡在這組數字上。</p>' +
      sensTable(B) + '</div>' +
      '<div class="card"><h2>最近 60 個已經對完答案的名單</h2>' + recentTable(B) + '</div>' +
      '<div class="card"><h2>怎麼算的</h2><div class="note" style="line-height:1.9">' +
      '<b>評分標準</b>：名單公布後，用隔天開盤價當起點，接下來 10 個交易日逐日看收盤（除權息還原）。' +
      '先有一天收盤漲到 +5% 算「中」、先跌到 −5% 算「倒」、都沒有算「平」。隔天開盤一字漲停買不到的不算；持有期間停牌或下市算「倒」。<br>' +
      '<b>回測沒套的排除</b>：處置股、近 30 日注意股、全額交割股沒有歷史名單，只在每天的名單套用。<br>' +
      '<b>已知限制</b>：產業分類用的是現在的分類（只影響「同產業最多 3 檔」）；三大法人 2012 年 5 月才有資料，之前的法人分數一律給中間值；' +
      '2015 年 6 月以前漲跌幅是 7%，漲停判斷有跟著改。<br>' +
      '<b>事前登記</b>：所有規則、門檻、判定標準都在看到結果之前寫進研究紀錄（RESEARCH_LOG.md 第 11 輪），跑完之後沒有改。</div></div>';
    App.pager(document.getElementById('app'));
  });
});
</script>
</body></html>
