<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>/* 在 body 渲染前就套用主題，避免切換時閃一下白底 */
(function(){try{var t=localStorage.getItem('theme');
if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/style.css">
<script>/* 打開網站直接進今日清單；這一頁留給「更多 → 網站導覽」（?about=1） */
if (!/[?&]about=1/.test(location.search)) location.replace('short.html' + location.hash);</script>
<title>台股觀測</title></head><body>
<div class="wrap" id="app"></div>
<script src="assets/app.js"></script>
<script>
App.boot(null, function (meta) {
  var el = document.getElementById('app');
  el.innerHTML =
    '<div class="homehero">' +
      '<span class="eyebrow">個股查詢</span>' +
      '<h1>查一檔股票</h1>' +
      App.searchbox('', true) +
      '<div class="hint">輸入代號或名稱，例如 <strong>2330</strong> 或 <strong>台積電</strong>。' +
      '任何時候按 <kbd>/</kbd> 都會跳回這個框。</div>' +
      '<div class="chips" id="pop"></div>' +
    '</div>' +
    '<div class="card"><h2>這個網站有什麼</h2>' +
      '<p class="lead">資料截止 ' + App.esc(meta.data_date) + '，每個交易日收盤後自動更新。</p>' +
      '<ul class="note">' +
      '<li><a href="short.html"><strong>今日清單</strong></a>：每天收盤後依四個條件打分數，列出前 20 檔，' +
      '最上面直接寫出「今天照規則可以買哪一檔、買多少」，附參考停損與目標價。</li>' +
      '<li><a href="journal.html"><strong>交易紀錄</strong></a>：記下你真的下的單，自動算違規次數和' +
      '「該不該全部停下來」的條件。資料只存在你的瀏覽器。</li>' +
      '<li><a href="history.html"><strong>策略追蹤</strong></a>：九種買法從 2026-09 起同時「紙上」往前跑' +
      '（不花錢、照規則假裝買賣），看哪一種在沒看過的未來真的贏過 0050。</li>' +
      '<li><a href="backtest.html"><strong>回測報告</strong></a>：假設過去 18 年每天都照清單買，結果如何。</li>' +
      '<li><strong>更多</strong>：<a href="lists.html">其他排行</a>（營收優於預期、成交金額、法人買賣…）與' +
      '<a href="funnel.html">中長期候選池</a>（適合長抱的股票，跟短線清單無關）。</li>' +
      '<li><strong>查個股</strong>：用上面或頂部的搜尋框，看一檔股票進場前該確認的事' +
      '（好不好買賣、波動大不大、有沒有要除權息…）。</li></ul></div>' +
    '<div class="card"><h2>先說清楚</h2><ul class="note">' +
      '<li>所有清單都是<strong>依規則篩出來的參考</strong>，不是買賣建議，也不會幫你下單。</li>' +
      '<li>每一份清單都盡量附上「過去照著買的結果」。有些名單過去表現並不好，' +
      '網站上會直接寫出來，不會藏起來。</li>' +
      '<li>過去的表現不代表以後會一樣。</li></ul></div>';
  var pop = ['2330','2317','2454','2308','0050','0056','2412','1101'];
  document.getElementById('pop').innerHTML = pop.map(function (c) {
    return '<a class="chip" href="stock.html?c=' + c + '">' + c + '</a>';
  }).join('');
});
</script>
</body></html>
