<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>/* 在 body 渲染前就套用主題，避免切換時閃一下白底 */
(function(){try{var t=localStorage.getItem('theme');
if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/style.css">
<title>台股觀測</title>
<style>
/* 首頁只有一個查個股的大搜尋框：名單在「今日名單」，不在這裡重複一份 */
.homehero{max-width:720px;margin:0 auto;padding:clamp(48px,14vh,140px) 0 40px;text-align:center;border:0}
.homehero h1{font-size:clamp(30px,5vw,46px);letter-spacing:-.03em;font-weight:500;margin:0 0 22px}
.homehero .searchbox{text-align:left}
.homehero .hint{color:var(--mut);font-size:13.5px;margin-top:14px}
</style></head><body>
<div class="wrap" id="app"></div>
<script src="assets/app.js"></script>
<script>
App.boot('home', function () {
  document.getElementById('app').innerHTML =
    '<div class="homehero"><h1>查一檔股票</h1>' + App.searchbox('', true) +
    '<div class="hint">輸入代號或名稱，例如 <strong>2330</strong> 或 <strong>台積電</strong>。' +
    '任何頁面按 <kbd>/</kbd> 都會跳回這個框。</div></div>';
  var box = document.querySelector('.homehero .qin');
  if (box) box.focus();
});
</script>
</body></html>
