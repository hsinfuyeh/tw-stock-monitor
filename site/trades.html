<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">

if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">

<title>交易體檢</title>
<style>
#csv{width:100%;min-height:150px;font:13px/1.5 ui-monospace,Consolas,monospace;padding:10px;border:1px solid var(--line);
     border-radius:10px;background:var(--bg);color:var(--fg);box-sizing:border-box}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0 4px;align-items:center}
.btns button,.btns label{font:inherit;font-size:14px;padding:7px 14px;border-radius:999px;border:1px solid var(--line);
     background:var(--bg);color:var(--fg);cursor:pointer}
.btns button.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btns input[type=file]{display:none}
.verdict{font-size:15px;line-height:1.6;padding:12px 16px;border-radius:10px;background:var(--sunk);margin:8px 0 4px}

</head><body>
<div class="wrap" id="app"></div>
<script src="assets/app.js"></script>
<script>
/* 交易體檢：匯入自己的交易紀錄，看是「規則不行」還是「執行走樣」。
 * 仿照反詐投資王的 analyze（勝率、盈虧比、期望值、最大回落、是實力還是運氣），再補上它沒有的兩件事：
 *   1. 每一筆都跟「同一段期間抱 0050（含配息）」比 —— 多頭時幾乎任何做法的絕對損益都是正的，不扣大盤會高估自己
 *   2. 自動判斷這筆買進是不是照名單（當時前一個交易日的名單上有沒有這檔），分開算成績
 * 全部在這個瀏覽器裡算，交易紀錄不會上傳、也不會存起來（重新整理就不見了）。 */
var BENCH = null, LISTS = {}, LIST_DATES = [];
var FEE = 0.001425, FEE_MIN = 20, TAX = 0.003;

/* ---------- 讀 CSV ---------- */
var COLS = {
  date: ['日期', '成交日期', '交易日期', 'date'], code: ['代號', '股票代號', '證券代號', 'code'],
  side: ['買賣', '買賣別', '交易別', 'side'], shares: ['股數', '成交股數', '數量', 'shares'], lots: ['張數', '張'],
  price: ['價格', '成交價', '成交價格', '單價', 'price'], fee: ['手續費', 'fee'], tax: ['交易稅', '證交稅', 'tax'],
  reason: ['理由', '策略', '備註', '進場理由', 'reason']
};
function splitLine(line) {
  var out = [], cur = '', q = false;
  for (var i = 0; i < line.length; i++) {
    var ch = line[i];
    if (ch === '"') { if (q && line[i + 1] === '"') { cur += '"'; i++; } else q = !q; }
    else if ((ch === ',' || ch === '\t') && !q) { out.push(cur); cur = ''; }
    else cur += ch;
  }
  out.push(cur);
  return out.map(function (x) { return x.trim(); });
}
function toDate(s) {
  var m = String(s).trim().match(/^(\d{2,4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  if (!m) return null;
  var y = +m[1]; if (y < 1911) y += 1911;                  // 民國年
  return y + '-' + ('0' + m[2]).slice(-2) + '-' + ('0' + m[3]).slice(-2);
}
function toNum(s) { var v = parseFloat(String(s).replace(/,/g, '')); return isFinite(v) ? v : null; }
function parseCsv(text) {
  var lines = text.replace(/^﻿/, '').split(/\r?\n/).filter(function (l) { return l.trim(); });
  if (lines.length < 2) throw new Error('至少要有標題列和一筆交易');
  var head = splitLine(lines[0]), ix = {};
  Object.keys(COLS).forEach(function (k) {
    var i = head.findIndex(function (h) { return COLS[k].indexOf(h.replace(/\s/g, '')) >= 0 || COLS[k].indexOf(h.toLowerCase()) >= 0; });
    if (i >= 0) ix[k] = i;
  });
  ['date', 'code', 'side', 'price'].forEach(function (k) {
    if (ix[k] == null) throw new Error('找不到「' + COLS[k][0] + '」這一欄（可以用的名稱：' + COLS[k].join('、') + '）');
  });
  if (ix.shares == null && ix.lots == null) throw new Error('找不到「股數」或「張數」這一欄');
  var rows = [], bad = [];
  lines.slice(1).forEach(function (l, n) {
    var c = splitLine(l), side = c[ix.side] || '';
    var r = { date: toDate(c[ix.date]), code: String(c[ix.code] || '').replace(/\D*$/, '').trim(),
              side: /^(買|B|buy)/i.test(side) ? 'B' : /^(賣|S|sell)/i.test(side) ? 'S' : null,
              shares: ix.shares != null ? toNum(c[ix.shares]) : (toNum(c[ix.lots]) || 0) * 1000,
              price: toNum(c[ix.price]), fee: ix.fee != null ? toNum(c[ix.fee]) : null,
              tax: ix.tax != null ? toNum(c[ix.tax]) : null, reason: ix.reason != null ? c[ix.reason] : '', line: n + 2 };
    if (!r.date || !r.code || !r.side || !(r.shares > 0) || !(r.price > 0)) bad.push(r.line); else rows.push(r);
  });
  rows.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.side === 'B' ? -1 : 1); });
  return { rows: rows, bad: bad };
}

/* ---------- 配對成完整的交易（先進先出） ---------- */
function feeOf(r, amt) { return r.fee != null ? r.fee : Math.max(FEE_MIN, Math.round(amt * FEE)); }
function taxOf(r, amt) { return r.tax != null ? r.tax : Math.round(amt * TAX); }
function match(rows) {
  var book = {}, trades = [], orphan = [];
  rows.forEach(function (r) {
    var amt = r.shares * r.price;
    if (r.side === 'B') {
      (book[r.code] = book[r.code] || []).push({ date: r.date, left: r.shares, price: r.price,
        costPer: (amt + feeOf(r, amt)) / r.shares, reason: r.reason });
      return;
    }
    var q = book[r.code] || [], need = r.shares, netPer = (amt - feeOf(r, amt) - taxOf(r, amt)) / r.shares;
    while (need > 0 && q.length) {
      var lot = q[0], k = Math.min(need, lot.left);
      trades.push({ code: r.code, buy: lot.date, sell: r.date, shares: k, bp: lot.price, sp: r.price,
                    cost: k * lot.costPer, net: k * netPer, reason: lot.reason });
      lot.left -= k; need -= k;
      if (!lot.left) q.shift();
    }
    if (need > 0) orphan.push(r.line);
  });
  var open = [];
  Object.keys(book).forEach(function (c) { book[c].forEach(function (l) { if (l.left > 0) open.push({ code: c, date: l.date, shares: l.left }); }); });
  return { trades: trades, orphan: orphan, open: open };
}

/* ---------- 0050 與名單 ---------- */
function benchAt(d) {               // d 當天或之前最近一天的 0050 總報酬指數
  var a = BENCH.dates, lo = 0, hi = a.length - 1;
  if (d < a[0]) return null;
  while (lo < hi) { var m = (lo + hi + 1) >> 1; if (a[m] <= d) lo = m; else hi = m - 1; }
  return BENCH.px[lo];
}
function onList(code, d) {          // 買進日之前最近一份名單（5 天內）上有沒有這檔
  var prev = null;
  for (var i = LIST_DATES.length - 1; i >= 0; i--) if (LIST_DATES[i] < d) { prev = LIST_DATES[i]; break; }
  if (!prev || (new Date(d) - new Date(prev)) / 864e5 > 5) return null;   // 名單從 2026-09-24 才開始存
  return LISTS[prev].indexOf(code) >= 0;
}

/* ---------- 成績 ---------- */
function stats(T) {
  var n = T.length;
  if (!n) return null;
  var ret = T.map(function (t) { return t.net / t.cost - 1; });
  var wins = ret.filter(function (r) { return r > 0; }), loss = ret.filter(function (r) { return r <= 0; });
  var mean = function (a) { return a.length ? a.reduce(function (s, x) { return s + x; }, 0) / a.length : null; };
  var pnl = T.map(function (t) { return t.net - t.cost; });
  var cum = 0, peak = 0, mdd = 0;
  T.slice().sort(function (a, b) { return a.sell < b.sell ? -1 : 1; }).forEach(function (t) {
    cum += t.net - t.cost; peak = Math.max(peak, cum); mdd = Math.min(mdd, cum - peak);
  });
  var ex = T.map(function (t) {
    var b0 = benchAt(t.buy), b1 = benchAt(t.sell);
    return b0 && b1 ? (t.net / t.cost - 1) - (b1 / b0 - 1) : null;
  }).filter(function (x) { return x != null; });
  var mx = mean(ex), sd = ex.length > 1 ? Math.sqrt(ex.reduce(function (s, x) { return s + (x - mx) * (x - mx); }, 0) / (ex.length - 1)) : null;
  var t = sd ? mx / (sd / Math.sqrt(ex.length)) : null;
  return { n: n, win: wins.length / n, avg: mean(ret), avgWin: mean(wins), avgLoss: mean(loss),
           ratio: mean(wins) != null && mean(loss) ? -mean(wins) / mean(loss) : null,
           ev: mean(pnl), total: pnl.reduce(function (s, x) { return s + x; }, 0), mdd: mdd,
           ex: mx, beat: ex.length ? ex.filter(function (x) { return x > 0; }).length / ex.length : null, nEx: ex.length, t: t };
}
function verdict(s) {
  if (!s) return '';
  if (s.n < 20) return '只有 <b>' + s.n + '</b> 筆完整交易，還太少，看不出是實力還是運氣（至少累積 30 筆再看）。';
  if (s.ex == null) return '這些交易的期間沒有 0050 的資料可以比。';
  if (s.ex <= 0) return '平均每筆<b>沒有贏過同期間抱 0050</b>（少 ' + App.num(-s.ex * 100, 2) + '%）。照這樣做，不如直接買 0050。';
  if (s.t < 2) return '平均每筆比同期間抱 0050 多 ' + App.num(s.ex * 100, 2) + '%，但' + App.tip('運氣機率') + '有 ' +
    App.luck(s.t) + '：<b>還分不出是實力還是運氣</b>。';
  return '平均每筆比同期間抱 0050 多 ' + App.num(s.ex * 100, 2) + '%，運氣機率' + App.luck(s.t) +
    '：<b>不太像只是運氣</b>。不過每筆交易不一定互相獨立（例如同一段行情裡買了好幾檔），這個機率會偏樂觀。';
}
function pctTxt(v, nd) { return v == null ? '—' : App.pct(v * 100, nd == null ? 1 : nd); }
function yuan(v) { return v == null ? '—' : '<span class="' + App.cls(v) + '">' + (v > 0 ? '+' : '') + App.num(v, 0) + ' 元</span>'; }
function statRow(name, s) {
  if (!s) return '';
  return '<tr><td style="text-align:left">' + name + '</td><td>' + s.n + '</td><td>' + App.num(s.win * 100, 0) + '%</td>' +
    '<td>' + pctTxt(s.avg, 2) + '</td><td>' + (s.ratio == null ? '—' : App.num(s.ratio, 2)) + '</td>' +
    '<td>' + yuan(s.ev) + '</td><td>' + yuan(s.total) + '</td><td>' + yuan(s.mdd) + '</td>' +
    '<td class="sorted">' + pctTxt(s.ex, 2) + '<br><span class="mut" style="font-size:12px">贏 0050 ' +
    (s.beat == null ? '—' : App.num(s.beat * 100, 0) + '%') + '</span></td>' +
    '<td>' + (s.t == null || s.nEx < 10 ? '<span class="mut">太少</span>' : App.luck(s.t)) + '</td></tr>';
}
function report(P, M) {
  var T = M.trades;
  T.forEach(function (t) { t.list = onList(t.code, t.buy); });
  var groups = [['全部', T]];
  var byList = { '照名單買（前一個交易日的名單上有）': T.filter(function (t) { return t.list === true; }),
                 '不在名單上': T.filter(function (t) { return t.list === false; }) };
  Object.keys(byList).forEach(function (k) { if (byList[k].length) groups.push([k, byList[k]]); });
  var reasons = {};
  T.forEach(function (t) { if (t.reason) (reasons[t.reason] = reasons[t.reason] || []).push(t); });
  Object.keys(reasons).sort().forEach(function (k) { groups.push(['理由：' + App.esc(k), reasons[k]]); });
  var all = stats(T);
  var warn = [];
  if (P.bad.length) warn.push('第 ' + P.bad.slice(0, 10).join('、') + ' 列看不懂，已略過');
  if (M.orphan.length) warn.push('第 ' + M.orphan.slice(0, 10).join('、') + ' 列的賣出找不到對應的買進（可能是更早買的），已略過');
  if (M.open.length) warn.push('還有 ' + M.open.length + ' 筆沒賣（未平倉），不算進成績');
  return '<div class="card"><h2>體檢結果</h2>' +
    '<div class="verdict">' + verdict(all) + '</div>' +
    (warn.length ? '<p class="note" style="font-size:13px">' + warn.join('；') + '。</p>' : '') +
    '<div class="scroll"><table><thead><tr><th style="text-align:left">分組</th><th>筆數</th><th>勝率</th><th>平均每筆</th>' +
    '<th>盈虧比</th><th>期望值</th><th>總損益</th><th>最大回落</th><th class="sorted">比抱 0050 多</th><th>' + App.tip('運氣機率') + '</th></tr></thead><tbody>' +
    groups.map(function (g) { return statRow(g[0], stats(g[1])); }).join('') + '</tbody></table></div>' +
    '<p class="note" style="font-size:13px">盈虧比 = 賺錢時平均賺幾 % ÷ 賠錢時平均賠幾 %。期望值 = 平均每筆賺或賠多少元。' +
    '最大回落 = 累計損益從最高點最多掉下來多少。「比抱 0050 多」是每筆的報酬減掉同一段期間 0050（含配息）的報酬，再平均；' +
    '多頭時幾乎任何做法的絕對損益都是正的，扣掉 0050 才看得出有沒有本事。' +
    '「照名單買」只能判斷 2026-09-24 之後的交易（名單從那天開始存）。沒填手續費和交易稅的，照一般費率估（手續費 0.1425%、最低 20 元，交易稅 0.3%）。</p></div>' +
    '<div class="card"><h2>每一筆</h2><div class="scroll" data-per="20"><table class="stk"><thead><tr><th>代號</th><th>買進</th><th>賣出</th><th>股數</th>' +
    '<th>買價</th><th>賣價</th><th class="sorted">報酬（扣費用）</th><th>同期 0050</th><th>照名單</th><th style="text-align:left">理由</th></tr></thead><tbody>' +
    T.map(function (t) {
      var b0 = benchAt(t.buy), b1 = benchAt(t.sell);
      return '<tr><td><a href="stock?c=' + App.esc(t.code) + '"><strong>' + App.esc(t.code) + '</strong></a></td><td>' + t.buy + '</td><td>' + t.sell + '</td>' +
        '<td>' + App.num(t.shares, 0) + '</td><td>' + App.num(t.bp) + '</td><td>' + App.num(t.sp) + '</td>' +
        '<td class="sorted">' + pctTxt(t.net / t.cost - 1, 2) + '</td><td class="mut">' + (b0 && b1 ? pctTxt(b1 / b0 - 1, 2) : '—') + '</td>' +
        '<td>' + (t.list === true ? '是' : t.list === false ? '否' : '<span class="mut">—</span>') + '</td>' +
        '<td style="text-align:left" class="mut">' + App.esc(t.reason || '') + '</td></tr>';
    }).join('') + '</tbody></table></div></div>';
}

/* 範例：虛構的交易，只是讓你看看長怎樣 */
var SAMPLE = '日期,代號,買賣,股數,價格,理由\n' +
  '2026/03/02,2330,買,1000,1050,照名單\n2026/03/16,2330,賣,1000,1120,照名單\n' +
  '2026/04/01,2603,買,2000,190,自己判斷\n2026/04/20,2603,賣,2000,176,自己判斷\n' +
  '2026/05/04,2317,買,2000,180,照名單\n2026/05/15,2317,賣,2000,189,照名單\n' +
  '2026/06/01,3008,買,100,2400,自己判斷\n2026/06/12,3008,賣,100,2310,自己判斷\n';

function run() {
  var out = document.getElementById('out');
  try {
    var P = parseCsv(document.getElementById('csv').value);
    if (!P.rows.length) throw new Error('沒有任何一列看得懂');
    var M = match(P.rows);
    if (!M.trades.length) throw new Error('沒有完整的「買進＋賣出」，算不出成績（只有買、還沒賣的不算）');
    out.innerHTML = report(P, M);
    App.pager(out);
  } catch (e) {
    out.innerHTML = '<div class="statusbar bad"><span class="txt"><b>讀不懂這份資料</b>：' + App.esc(e.message) + '</span></div>';
  }
}

App.boot('trades', function (meta) {
  document.getElementById('app').innerHTML =
    '<h1 style="font-size:30px;letter-spacing:-.03em;font-weight:500;margin:0 0 4px">交易體檢</h1>' +
    '<div class="meta">看自己實際的交易，是規則不行、還是執行走樣</div>' +
    '<div class="statusbar ok"><span class="txt"><b>交易紀錄不會離開你的電腦</b>：全部在這個瀏覽器裡計算，不會上傳，也不會存起來（重新整理就清空）。</span></div>' +
    '<div class="card"><h2>貼上或匯入交易紀錄</h2>' +
    '<p class="lead">名單成績是「紙上」的：假設完全照規則進出。實際下單會晚進場、沒停損、自己加碼，' +
    '這頁用你真實的交易紀錄，算出勝率、盈虧比、期望值，並且每一筆都跟同一段期間抱 0050 比。</p>' +
    '<p style="font-size:13.5px;margin:6px 0">需要的欄位：<b>日期、代號、買賣、股數（或張數）、價格</b>；可以多一欄<b>理由</b>（例如「照名單」「自己判斷」）分開算成績，' +
    '也可以附上實際的<b>手續費</b>、<b>交易稅</b>。券商對帳單匯出的 CSV 改一下標題列通常就能用。</p>' +
    '<textarea id="csv" spellcheck="false" placeholder="日期,代號,買賣,股數,價格,理由\n2026/03/02,2330,買,1000,1050,照名單\n2026/03/16,2330,賣,1000,1120,照名單"></textarea>' +
    '<div class="btns"><button class="primary" id="go" type="button">開始體檢</button>' +
    '<label>選擇 CSV 檔<input type="file" id="file" accept=".csv,.txt,text/csv"></label>' +
    '<button id="sample" type="button">載入範例（虛構的交易）</button></div></div>' +
    '<div id="out"></div>';
  document.getElementById('go').addEventListener('click', run);
  document.getElementById('sample').addEventListener('click', function () { document.getElementById('csv').value = SAMPLE; run(); });
  document.getElementById('file').addEventListener('change', function (e) {
    var f = e.target.files[0];
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      var buf = new Uint8Array(rd.result), txt = new TextDecoder('utf-8', { fatal: false }).decode(buf);
      if (txt.indexOf('�') >= 0) {     // 券商的 CSV 常常是 Big5
        try { txt = new TextDecoder('big5').decode(buf); } catch (err) {}
      }
      document.getElementById('csv').value = txt;
      run();
    };
    rd.readAsArrayBuffer(f);
  });
  return Promise.all([App.get('bench.json'), App.get('stable/lists.json').catch(function () { return {}; })]).then(function (r) {
    BENCH = r[0]; LISTS = r[1] || {}; LIST_DATES = Object.keys(LISTS).sort();
  });
});
</script>
</body></html>
