<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>/* 在 body 渲染前就套用主題，避免切換時閃一下白底 */
(function(){try{var t=localStorage.getItem('theme');
if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/style.css">
<title>其他排行</title></head><body>
<div class="wrap" id="app"></div>
<script src="assets/app.js"></script>
<script>
/* 分組從 meta.json 讀（App.otherTabs），不在這裡維護第二份。
   原本這裡抄了一份 GROUPS，新增榜單時只改到 Python 那邊，
   靜態站的分頁就少一個 —— 而且不會報錯，只是那個榜單消失。 */

/* 表格產生抽成函式：綜合評分要畫兩張（分數最高 / 最低 10 名），
   兩張欄位完全一樣，複製一份遲早會有人只改到其中一張。 */
function rowsTable(d, rows) {
  /* 每個榜單同一組欄位、同一組欄寬：代號、名稱、產業、收盤、今日、這個榜的指標、法人買超、日均成交額。
     法人買的榜單，指標本身就是法人買超，那一欄留「—」而不是整欄拿掉，欄位才對得齊。 */
  var instList = d.extra === '法人買超';
  return '<div class="scroll"><table class="ltable stk"><colgroup><col style="width:64px"><col>' +
    '<col style="width:92px"><col style="width:84px"><col style="width:78px"><col style="width:112px">' +
    '<col style="width:86px"><col style="width:92px"></colgroup><thead><tr><th>代號</th><th style="text-align:left">名稱</th>' +
    '<th>產業</th><th>' + App.tip('收盤') + '</th><th>' + App.tip('今日') + '</th>' +
    '<th class="sorted">' + App.tip(d.extra_title || '') + '</th>' +
    '<th>' + App.tip('法人買超') + '</th><th>' + App.tip('日均成交額') + '</th></tr></thead><tbody>' +
    rows.map(function (r) {
      var ex = r.extra;
      var exTxt = ex == null ? '—' :
        (d.extra === 'amount' ? App.yi(ex) :
         d.extra === 'vol_ratio' ? App.num(ex) + ' 倍' :
         d.extra === 'annvol' ? App.num(ex, 0) + '%' :
         d.extra === 'posv' ? App.num(ex, 0) + '%' :
         d.extra === 'sue' ? App.num(ex, 1) + ' 倍' :
         d.extra === '_s' ? App.num(ex, 2, true) :
         d.extra === '法人買超' ? App.pct(ex * 100, 1) :
         App.pct(ex, d.extra === 'yoy' ? 1 : 2));
      return '<tr><td><a href="stock?c=' + r.code + '"><strong>' + r.code +
        '</strong></a></td><td style="text-align:left"><a href="stock?c=' + r.code + '">' +
        App.esc(r.name) + '</a></td><td class="mut">' + App.esc(r.ind || '—') + '</td><td>' +
        App.num(r.close) + '</td><td>' + App.pct(r.chg_pct) + '</td><td class="sorted">' + exTxt + '</td>' +
        '<td>' + (instList || r['法人買超'] == null ? '—' : App.pct(r['法人買超'] * 100, 1)) + '</td>' +
        '<td class="mut">' + App.yi(r.amt20) + '</td></tr>';
    }).join('') + '</tbody></table></div>';
}

/* 除權息的配發：現金股利、無償配股（每股 0.05 = 每千股配 50 股）、現金增資。
   金額還沒公布就寫「待公告」，不要顯示成 0。 */
function exPay(r) {
  var tbd = '<span class="mut">待公告</span>', parts = [];
  if (r.value == null) parts.push('現金 ' + tbd);
  else if (r.value > 0) parts.push(App.num(r.value) + ' 元');
  if (r.stock > 0) parts.push('配股 ' + App.num(r.stock * 100, 1) + '%');
  if (r.rights > 0) parts.push('現增 ' + App.num(r.rights * 100, 1) + '%（' +
    (r.rights_px == null ? '認購價' + tbd : App.num(r.rights_px) + ' 元') + '）');
  return parts.join('<br>') || tbd;
}

/* 社群聲量兩張榜（social.py）。欄位：聲量、來源拆解、平常（前 20 個交易日平均）與倍數。 */
function socialTable(d) {
  var surge = d.key === 'social_surge';
  return '<div class="scroll"><table class="ltable stk"><colgroup><col style="width:64px"><col>' +
    '<col style="width:92px"><col style="width:78px"><col style="width:78px"><col style="width:84px">' +
    '<col style="width:150px"><col style="width:110px"></colgroup><thead><tr><th>代號</th>' +
    '<th style="text-align:left">名稱</th><th>產業</th><th>' + App.tip('收盤') + '</th><th>' + App.tip('今日') + '</th>' +
    '<th' + (surge ? '' : ' class="sorted"') + '>聲量</th><th>來源</th>' +
    '<th' + (surge ? ' class="sorted"' : '') + '>平常 → 倍數</th></tr></thead><tbody>' +
    d.rows.map(function (r) {
      var src = ['PTT 文章 ' + r.ptt_posts, '推文 ' + r.ptt_pushes];
      if (r.threads) src.push('Threads ' + r.threads);
      return '<tr><td><a href="stock?c=' + r.code + '"><strong>' + r.code + '</strong></a></td>' +
        '<td style="text-align:left"><a href="stock?c=' + r.code + '">' + App.esc(r.name) + '</a>' +
        (r.otc ? ' <span class="mut" style="font-size:11.5px">上櫃</span>' : '') + '</td>' +
        '<td class="mut">' + App.esc(r.ind || '—') + '</td><td>' + App.num(r.close) + '</td>' +
        '<td>' + App.pct(r.chg_pct) + '</td><td' + (surge ? '' : ' class="sorted"') + '>' + r.extra + '</td>' +
        '<td class="mut" style="white-space:normal;font-size:12.5px;line-height:1.5">' + src.join('<br>') + '</td>' +
        '<td' + (surge ? ' class="sorted"' : '') + '>' + (r.base == null ? '—' :
          App.num(r.base, 1) + ' → <b>' + App.num(r.ratio, 1) + ' 倍</b>') + '</td></tr>';
    }).join('') + '</tbody></table></div>';
}

/* 社群資料的涵蓋範圍與各來源狀態，放在表格上面：哪天到哪天、PTT 抓到幾篇、Threads 有沒有開。 */
function socialStatus(d) {
  var st = d.social || {};
  if (st.error) return '<p class="note up">社群資料這次抓不到：' + App.esc(st.error) + '</p>';
  var w = st.window || [];
  var ptt = (st.sources || [])[0] || {};
  var upd = st.ptt_updated ? String(st.ptt_updated).slice(0, 16).replace('T', ' ') : '';
  var parts = ['統計期間 ' + App.esc(w[0] === w[1] ? w[0] : (w[0] || '') + ' ~ ' + (w[1] || '')) +
    '（上一個交易日之後到這個交易日，連假的討論算進開市那天）',
    ptt.status === 'missing'
      ? '<b>PTT 股票板還沒有資料</b>：PTT 由使用者電腦上的排程抓，排程還沒跑過'
      : 'PTT 股票板 ' + (ptt.articles || 0) + ' 篇文章（連同底下的推文一起算），抓取時間 ' + App.esc(upd),
    'Threads ' + (st.threads === 'on' ? '已啟用' : '未啟用（需要 Meta 官方 API 金鑰）'),
    'Dcard、Mobile01 被網站防護擋住、CMoney 沒有公開資料，所以沒有收'];
  if (st.ptt_stale) parts.push('<b>PTT 資料停在 ' + App.esc(upd) +
    '：抓 PTT 的電腦這段期間沒有開機，之後的討論還沒算進來</b>');
  if (st.too_new) parts.push('<b>「暴增」需要至少 5 個交易日的歷史才能比，資料還在累積中（目前 ' +
    (st.base_windows || 0) + ' 天）</b>');
  // 不用 .note：共用層會把 .note 收成 ⓘ 提示，這幾行（來源開了沒）要直接看得到
  return '<div class="mut" style="font-size:13px;line-height:1.7;margin:0 0 12px">' + parts.join('<br>') + '</div>';
}

App.boot('lists', function (meta) {
  var key = App.qs('s') || 'sue';
  var info = {};
  (meta.screens || []).forEach(function (s) { info[s.key] = s; });
  var tabs = App.otherTabs(meta, key);

  var isEx = key === 'exdiv';
  var isSocial = key.indexOf('social_') === 0;
  var metaline = isSocial
    ? '社群上被提到的次數 ｜ 上市、上櫃普通股 ｜ 點代號看個股'
    : isEx
    ? '未來 60 天內的除權息（證交所預告表，全部上市普通股） ｜ 資料截止 ' + App.esc(meta.data_date)
    : '資料截止 ' + App.esc(meta.data_date) +
      ' ｜ 只列近 20 日平均每天成交 2,000 萬以上的股票 ｜ 點代號看個股';
  document.title = '其他排行 · ' + (info[key] ? info[key].title : '');

  return App.get('screens/' + key + '.json').then(function (d) {
    var tbl;
    if (!d.rows.length) {
      tbl = (isSocial ? socialStatus(d) : '') +
        '<div class="empty"><div class="note">今天沒有符合條件的標的。</div></div>';
    } else if (isSocial) {
      tbl = socialStatus(d) + socialTable(d);
    } else if (isEx) {
      tbl = '<div class="scroll"><table class="ltable stk"><colgroup><col style="width:64px"><col>' +
        '<col style="width:92px"><col style="width:96px"><col style="width:84px"><col style="width:190px">' +
        '<col style="width:96px"></colgroup><thead><tr><th>代號</th><th style="text-align:left">名稱</th><th>產業</th>' +
        '<th>' + App.tip('除權息日','除權息') + '</th><th>還有</th><th>' +
        App.tip('配發') + '</th><th>' + App.tip('換算幅度') + '</th></tr></thead><tbody>' +
        d.rows.map(function (r) {
          return '<tr><td><a href="stock?c=' + r.code + '"><strong>' + r.code +
            '</strong></a></td><td style="text-align:left">' + App.esc(r.name) + '</td><td class="mut">' +
            App.esc(r.ind || '—') + '</td><td>' +
            App.esc(r.date.slice(5)) + '</td><td>' + r.days_left + ' 天後</td><td style="white-space:normal;line-height:1.5">' +
            exPay(r) + '</td><td>' + (r.yield_pct == null ? '—' : App.num(r.yield_pct) + '%') + '</td></tr>';
        }).join('') + '</tbody></table></div>';
    } else {
      tbl = rowsTable(d, d.rows);
    }

    /* 警語。這是載重結構不是裝飾 —— 綜合評分那份名單已驗證為反指標，
       少了這段就變成一個看起來很有說服力的薦股清單。 */
    var note = '';
    if (d.note) {
      note = '<div class="statusbar ' + d.note[0] + '"><span class="txt">' +
        d.note[1] + '</span><span class="more" data-for="nx">為什麼？</span></div>' +
        '<div class="expand" id="nx">' + d.note[2] + '</div>';
    }
    /* 綜合評分有第二張表（分數最低 10 名） */
    var tbl2 = '';
    if (d.rows_bottom && d.rows_bottom.length) {
      tbl2 = '<h3 style="font-size:15px;margin:26px 0 8px">分數最低 10 名</h3>' +
        rowsTable(d, d.rows_bottom);
    }

    document.getElementById('app').innerHTML =
      '<h1 style="font-size:30px;letter-spacing:-.03em;font-weight:500;margin:0 0 4px">' +
      '其他排行</h1><div class="meta">' + metaline + ' ｜ 共 ' + d.rows.length + ' 筆' +
      (d.rows_bottom && d.rows_bottom.length ? '（最高、最低各 ' + d.rows_bottom.length + ' 筆）' : '') + '</div>' +
      '<p class="note" style="margin:0">跟短線清單無關、另外整理的名單。名單本身都不是買進建議；' +
      '標題旁的標籤告訴你這份名單「過去照著買有沒有用」。</p>' +
      '<div class="lgrid">' + tabs + '<div class="lmain">' + note +
      '<div class="card"><h2>' + App.esc(d.title) + App.listBadge(meta, key) + '</h2>' +
      '<p class="lead">' + d.desc + '</p>' +
      (tbl2 ? '<h3 style="font-size:15px;margin:0 0 8px">分數最高 10 名</h3>' : '') +
      tbl + tbl2 + '</div></div></div>';

    /* 可展開的警語細節 */
    var more = document.querySelector('.statusbar .more');
    if (more) more.addEventListener('click', function () {
      var box = document.getElementById(more.getAttribute('data-for'));
      more.textContent = box.classList.toggle('open') ? '收合' : '為什麼？';
    });
    App.pager(document.getElementById('app'));
  });
});
</script>
</body></html>
