if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>

<title>盤中排行</title>
<style>
.lvbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:0 0 6px}
.lvbar .grp{display:flex;gap:6px;align-items:center;font-size:13.5px;color:var(--mut)}
.chip.on{background:var(--pillbg);color:var(--pillfg);border-color:var(--pillbg)}
.chip{cursor:pointer;padding:6px 14px}
.breadth{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;margin:10px 0 4px;font-variant-numeric:tabular-nums}
.breadth b{font-weight:600}
.breadth .ix{font-weight:500}
.lvst{display:inline-flex;align-items:center;gap:8px}

@keyframes lvp{50%{opacity:.3}}
.lvmore{margin-top:12px}

.tg.etf{color:var(--faint)}
.sm{font-size:12px;color:var(--mut);white-space:nowrap}
table.ltable td{font-variant-numeric:tabular-nums}

</head><body>
<div class="wrap" id="app"></div>
<script src="assets/app.js"></script>
<script>
/* 盤中排行：上市股票＋ETF 當下的各種排行，版面跟「其他排行」一樣（左邊選名單）。
 * 報價由 Cloudflare Worker 的 /live 代讀證交所即時報價（約 5 秒更新一次的來源，Worker 暫存 30 秒），
 * 開盤時間每 30 秒自動重抓。量比、新高新低、產業要用到「平常」的數字，來自網站每天產出的
 * data/live_ref.json（publish.emit_live_ref）。
 * 全部是「現在怎樣」的事實，不是預測，也沒有經過回測。
 * 本機測試 Worker：網址加 ?worker=http://localhost:8787 */
var LV = { data: null, ref: null, scope: 'all', minVol: 500, n: 30, timer: null, loading: false, key: 'gain' };
var REFRESH = 30e3;
var WORKER = App.worker;
(function () {
  var m = /[?&]worker=([^&]+)/.exec(location.search);
  if (m && App.local) WORKER = decodeURIComponent(m[1]);
  try {
    var s = JSON.parse(localStorage.getItem('live_pref') || '{}');
    if (s.scope) LV.scope = s.scope;
    if (s.minVol != null) LV.minVol = s.minVol;
  } catch (e) {}
})();
function savePref() {
  try { localStorage.setItem('live_pref', JSON.stringify({ scope: LV.scope, minVol: LV.minVol })); } catch (e) {}
}

/* ---------- 時段 ---------- */
/* 現在是不是交易時段（台北時間，週一到週五 8:30–13:35；8:30–9:00 是試撮）。休市日由資料日期判斷。 */
function session() {
  var t = App.twNow(), w = new Date(t.ymd + 'T00:00:00Z').getUTCDay();
  var wk = w >= 1 && w <= 5;
  return { ymd: t.ymd.replace(/-/g, ''), pre: wk && t.min >= 8 * 60 + 30 && t.min < 9 * 60,
           open: wk && t.min >= 9 * 60 && t.min <= 13 * 60 + 35 };
}
function statusText(d) {
  var s = session(), dd = d.date ? d.date.slice(0, 4) + '-' + d.date.slice(4, 6) + '-' + d.date.slice(6) : '';
  if (d.date !== s.ymd) return ['', '今天還沒開盤或休市，以下是 ' + dd + ' 的收盤'];
  if (s.pre) return ['live', '盤前試撮中（9:00 開盤），資料時間 ' + d.time + '，每 30 秒自動更新'];
  if (s.open && d.time < '13:30:00') return ['live', '盤中，資料時間 ' + d.time + '，每 30 秒自動更新'];
  return ['', '已收盤，以下是 ' + dd + ' 的收盤'];
}

/* 到資料時間為止，一般交易日大約成交了全天量的幾成。台股的量集中在開盤半小時和 13:25–13:30 的收盤集合競價，
   照時間平均分會讓早盤每一檔都像爆量。這是概略的估計（沒有逐筆歷史資料可以校正），量比只當相對參考。 */
var VOL_CURVE = [[0, 0], [5, .08], [15, .16], [30, .25], [60, .37], [120, .55], [180, .70], [240, .83], [265, .90], [270, 1]];
function volFrac(time) {
  var m = /^(\d\d):(\d\d)/.exec(time || '');
  if (!m) return 1;
  var x = (+m[1] - 9) * 60 + (+m[2]);
  if (x <= 0) return null;                    // 還沒開盤（試撮），量比沒有意義
  if (x >= 270) return 1;
  for (var i = 1; i < VOL_CURVE.length; i++) {
    var a = VOL_CURVE[i - 1], b = VOL_CURVE[i];
    if (x <= b[0]) return a[1] + (b[1] - a[1]) * (x - a[0]) / (b[0] - a[0]);
  }
  return 1;
}

/* ---------- 資料 ---------- */
/* Worker 的一列 -> 物件，併上參考值。
   參考值有兩組：live_ref.json 的資料日期之後的交易日用第一組（算到昨天）；
   即時報價就是資料日期當天（收盤後還沒換日）用第二組，不然今天自己的高點會被當成「前高」。 */
function enrich(d, ref) {
  var rd = ref && ref.date ? ref.date.replace(/-/g, '') : '';
  var set = d.date > rd ? 1 : 2;
  var frac = volFrac(d.time);               // 收盤後的資料時間是 13:30 之後 -> 整天
  return d.rows.map(function (r) {
    var x = { code: r[0], name: r[1], etf: !!r[2], p: r[3], pct: r[4], vol: r[5], o: r[6], h: r[7], l: r[8], y: r[9],
              lim: r[10], bid: r[11], ask: r[12], up: r[13], dn: r[14] };
    x.amt = x.p * x.vol * 1000;
    var f = ref && ref.rows[x.code];
    if (f) {
      x.ind = f[0];
      var v = f[set] || [];
      x.v20 = v[0]; x.h20 = v[1]; x.l20 = v[2]; x.h52 = v[3]; x.l52 = v[4];
      if (x.v20 > 0 && frac) x.vr = x.vol / (x.v20 * frac);
    }
    return x;
  });
}
function inScope(x) { return LV.scope === 'all' || (LV.scope === 'etf') === x.etf; }

/* ---------- 名單 ----------
   每張榜：[key, 標題, 說明, 指標欄標題, 篩選, 排序值（大的排前面）, 指標欄內容] */
function rel(a, b) { return a && b ? (a / b - 1) * 100 : null; }
/* 整天一個價（開盤就鎖漲停、跌停）：最高 = 最低，漲的算在最高點、跌的算在最低點 */
function pos(x) { return x.h && x.l && x.h > x.l ? (x.p - x.l) / (x.h - x.l) * 100 : x.h ? (x.pct > 0 ? 100 : x.pct < 0 ? 0 : null) : null; }
function zhang(v) { return v == null ? '—' : Math.round(v).toLocaleString() + ' 張'; }
function lockTxt(x, side) {
  var locked = side > 0 ? x.ask === 0 : x.bid === 0;
  var q = side > 0 ? x.bid : x.ask;
  return locked ? '<b>鎖住</b><div class="sm">' + (side > 0 ? '委買 ' : '委賣 ') + zhang(q) + '</div>'
                : '還有' + (side > 0 ? '賣單' : '買單') + '<div class="sm">委買 ' + zhang(x.bid) + '／委賣 ' + zhang(x.ask) + '</div>';
}
var GROUPS = [
  ['盤中行情', [
    ['gain', '漲幅排行', '現價比昨天收盤漲最多的。旁邊的「盤中位置」是現價落在今天最低到最高之間的哪裡：100% 是收在最高點，' +
      '漲很多但位置低，代表衝高之後被賣下來。', '盤中位置',
      function (x) { return x.pct > 0; }, function (x) { return x.pct + x.vol * 1e-12; },
      function (x) { var v = pos(x); return v == null ? '—' : App.num(v, 0) + '%'; }],
    ['loss', '跌幅排行', '現價比昨天收盤跌最多的。「盤中位置」0% 是現價就在今天最低點，跌很多但位置高，代表殺低之後有人承接。', '盤中位置',
      function (x) { return x.pct < 0; }, function (x) { return -x.pct + x.vol * 1e-12; },
      function (x) { var v = pos(x); return v == null ? '—' : App.num(v, 0) + '%'; }],
    ['amount', '成交值最大', '成交金額（價格 × 成交量）最大的。比成交張數更能看出資金集中在哪裡：低價股張數多不代表錢多。' +
      '指標欄是占「目前範圍內全部成交值」的比例。', '占全部成交值',
      null, function (x) { return x.amt; },
      function (x, ctx) { return ctx.totAmt ? App.num(x.amt / ctx.totAmt * 100, 1) + '%' : '—'; }],
    ['volume', '成交量最大', '成交張數最多的。', '成交量',
      null, function (x) { return x.vol; }, function (x) { return zhang(x.vol); }],
    ['vratio', '量比最高（爆量）', '量比 = 到目前為止的成交量 ÷（近 20 日平均量 × 一般交易日到這個時間的成交比例）。' +
      '量比 3 代表到現在的量是平常同一時間的 3 倍，通常是有消息或有人大量進出。' +
      '「平常同一時間的比例」是概略估計（開盤半小時和收盤集合競價的量特別大），只當相對參考。', '今天／20 日均量',
      function (x) { return x.vr != null; }, function (x) { return x.vr; },
      function (x) { return '<b>' + App.num(x.vr, 1) + ' 倍</b><div class="sm">' + zhang(x.vol) + '／均 ' + zhang(x.v20) + '</div>'; }]
  ]],
  ['開盤與盤中走勢', [
    ['gapup', '開高最多', '開盤價比昨天收盤高最多的：隔夜有消息、一開盤就被搶。指標欄是開盤漲幅，「今日」欄是現在的漲幅 ——' +
      '兩個一比，就知道開高之後是續強還是走低。', '開盤漲跌',
      function (x) { return x.o > x.y; }, function (x) { return rel(x.o, x.y); }, function (x) { return App.pct(rel(x.o, x.y), 2); }],
    ['gapdn', '開低最多', '開盤價比昨天收盤低最多的。比「今日」欄就知道開低之後有沒有拉回來。', '開盤漲跌',
      function (x) { return x.o < x.y; }, function (x) { return -rel(x.o, x.y); }, function (x) { return App.pct(rel(x.o, x.y), 2); }],
    ['openup', '開盤後轉強', '現價比今天開盤價漲最多的（開低走高、開平走高）：盤中有買盤一路推上去。', '開盤後',
      function (x) { return x.o && x.p > x.o; }, function (x) { return rel(x.p, x.o); }, function (x) { return App.pct(rel(x.p, x.o), 2); }],
    ['opendn', '開盤後轉弱', '現價比今天開盤價跌最多的（開高走低、開平走低）：盤中賣壓一路壓下來。', '開盤後',
      function (x) { return x.o && x.p < x.o; }, function (x) { return -rel(x.p, x.o); }, function (x) { return App.pct(rel(x.p, x.o), 2); }],
    ['range', '振幅最大', '今天最高價到最低價的距離（以昨收為基準）最大的：多空拉鋸最激烈。', '振幅',
      function (x) { return x.h && x.l && x.y; }, function (x) { return (x.h - x.l) / x.y * 100; },
      function (x) { return App.num((x.h - x.l) / x.y * 100, 2) + '%'; }],
    ['pullback', '從高點回落最多', '現價比今天最高價低最多的：衝高之後賣壓出現。指標欄下面的小字是當時最高漲到多少。', '距今日高點',
      function (x) { return x.h > x.p; }, function (x) { return -rel(x.p, x.h); },
      function (x) { return App.pct(rel(x.p, x.h), 2) + '<div class="sm">最高 ' + App.num(rel(x.h, x.y), 2, true) + '%</div>'; }]
  ]],
  ['漲跌停', [
    ['limup', '漲停', '現價在漲停價的。「鎖住」是賣方一張都沒有、只剩排隊要買的（委買張數越多越強）；' +
      '「還有賣單」是漲停價上有人在賣，隨時可能打開。', '狀態',
      function (x) { return x.lim === 1; }, function (x) { return (x.ask === 0 ? 1e9 : 0) + x.bid; },
      function (x) { return lockTxt(x, 1); }],
    ['limopen', '漲停打開', '今天曾經碰到漲停、現在已經不在漲停價的：追價的買盤撐不住。指標欄是現價離漲停還有多遠，離越遠排越前面。', '距漲停',
      function (x) { return x.up && x.h >= x.up && x.lim !== 1; }, function (x) { return -rel(x.p, x.up); },
      function (x) { return App.pct(rel(x.p, x.up), 2); }],
    ['limdn', '跌停', '現價在跌停價的。「鎖住」是買方一張都沒有、只剩排隊要賣的。', '狀態',
      function (x) { return x.lim === -1; }, function (x) { return (x.bid === 0 ? 1e9 : 0) + x.ask; },
      function (x) { return lockTxt(x, -1); }],
    ['dnopen', '跌停打開', '今天曾經碰到跌停、現在已經離開跌停價的：低檔有人承接。拉回越多排越前面。', '距跌停',
      function (x) { return x.dn && x.l && x.l <= x.dn && x.lim !== -1; }, function (x) { return rel(x.p, x.dn); },
      function (x) { return App.pct(rel(x.p, x.dn), 2); }]
  ]],
  ['掛單', [
    ['bidstr', '委買力道最強', '最佳五檔的委買張數占買賣掛單合計最多的（排除漲跌停，那時只有單邊掛單）。' +
      '注意：掛單隨時可以撤掉，有人會掛大單誘導，只能當輔助，不能單獨看。', '買盤占比',
      function (x) { return x.lim === 0 && x.bid + x.ask >= 100; }, function (x) { return x.bid / (x.bid + x.ask); },
      function (x) { return '<b>' + App.num(x.bid / (x.bid + x.ask) * 100, 0) + '%</b><div class="sm">買 ' + zhang(x.bid) + '／賣 ' + zhang(x.ask) + '</div>'; }],
    ['askstr', '委賣力道最強', '最佳五檔的委賣張數占買賣掛單合計最多的（排除漲跌停）。一樣要注意掛單可以撤掉。', '賣盤占比',
      function (x) { return x.lim === 0 && x.bid + x.ask >= 100; }, function (x) { return x.ask / (x.bid + x.ask); },
      function (x) { return '<b>' + App.num(x.ask / (x.bid + x.ask) * 100, 0) + '%</b><div class="sm">買 ' + zhang(x.bid) + '／賣 ' + zhang(x.ask) + '</div>'; }]
  ]],
  ['新高新低', [
    ['hi20', '創 20 日新高', '現價高過前 20 個交易日的最高價（不含今天）：短線突破。上市不到 20 個交易日的不列。', '超出前高',
      function (x) { return x.h20 && x.p > x.h20; }, function (x) { return rel(x.p, x.h20); },
      function (x) { return App.pct(rel(x.p, x.h20), 2) + '<div class="sm">前高 ' + price(x.h20) + '</div>'; }],
    ['lo20', '創 20 日新低', '現價低過前 20 個交易日的最低價（不含今天）：短線跌破。', '低於前低',
      function (x) { return x.l20 && x.p < x.l20; }, function (x) { return -rel(x.p, x.l20); },
      function (x) { return App.pct(rel(x.p, x.l20), 2) + '<div class="sm">前低 ' + price(x.l20) + '</div>'; }],
    ['hi52', '創一年新高', '現價高過前一年（約 250 個交易日）的最高價。上市不到 60 個交易日的不列。', '超出前高',
      function (x) { return x.h52 && x.p > x.h52; }, function (x) { return rel(x.p, x.h52); },
      function (x) { return App.pct(rel(x.p, x.h52), 2) + '<div class="sm">前高 ' + price(x.h52) + '</div>'; }],
    ['lo52', '創一年新低', '現價低過前一年的最低價。高低點用的是原始價格、沒有扣掉配息，' +
      '所以一年內有除息的股票（特別是高股息的）會比較容易「創新低」；分割、減資後也會出現假的新高新低。', '低於前低',
      function (x) { return x.l52 && x.p < x.l52; }, function (x) { return -rel(x.p, x.l52); },
      function (x) { return App.pct(rel(x.p, x.l52), 2) + '<div class="sm">前低 ' + price(x.l52) + '</div>'; }]
  ]],
  ['產業', [
    ['ind', '產業強弱', '依產業（ETF 依類型）彙總今天有成交的股票：平均漲跌幅、上漲家數比例、成交值。' +
      '一眼看出今天資金在哪些族群。點產業名稱可以看那個產業的成交值排行。', '', null, null, null]
  ]]
];
var BYKEY = {};
GROUPS.forEach(function (g) { g[1].forEach(function (t) { BYKEY[t[0]] = t; }); });

/* 價格照證交所的寫法：50 元以下兩位小數，以上去掉多餘的 0（603、87.9、5225） */
function price(p) {
  return p == null ? '—' : p < 50 ? p.toFixed(2) : String(+p.toFixed(2));
}

/* 左側清單（桌機）／下拉選單（手機），樣式跟「其他排行」共用 */
function sideTabs() {
  var side = GROUPS.map(function (g) {
    return '<div class="lgrp"><span class="glabel">' + App.esc(g[0]) + '</span>' + g[1].map(function (t) {
      return '<a href="live?s=' + t[0] + '" data-k="' + t[0] + '" class="litem' + (t[0] === LV.key ? ' on' : '') + '">' + App.esc(t[1]) + '</a>';
    }).join('') + '</div>';
  }).join('');
  var sel = '<select class="lsel" id="lvsel" aria-label="選擇名單">' + GROUPS.map(function (g) {
    return '<optgroup label="' + App.esc(g[0]) + '">' + g[1].map(function (t) {
      return '<option value="' + t[0] + '"' + (t[0] === LV.key ? ' selected' : '') + '>' + App.esc(t[1]) + '</option>';
    }).join('') + '</optgroup>';
  }).join('') + '</select>';
  return '<aside class="lside" id="lvside">' + side + '</aside>' + sel;
}

function stockTable(list, t, ctx) {
  if (!list.length) return '<div class="empty"><div class="note">現在沒有符合條件的股票。</div></div>';
  return '<div class="scroll"><table class="ltable stk lmob"><colgroup><col style="width:64px"><col>' +
    '<col style="width:92px"><col style="width:78px"><col style="width:78px"><col style="width:130px">' +
    '<col style="width:70px"><col style="width:84px"></colgroup><thead><tr><th>代號</th><th style="text-align:left">名稱</th>' +
    '<th>產業</th><th>成交價</th><th>今日</th><th class="sorted">' + App.esc(t[3]) + '</th><th>量比</th><th>成交值</th></tr></thead><tbody>' +
    list.map(function (x) {
      var tag = x.lim === 1 ? '<span class="tg up">漲停</span>' : x.lim === -1 ? '<span class="tg dn">跌停</span>' : '';
      return '<tr><td><a href="stock?c=' + encodeURIComponent(x.code) + '"><strong>' + App.esc(x.code) + '</strong></a></td>' +
        '<td style="text-align:left"><a href="stock?c=' + encodeURIComponent(x.code) + '">' + App.esc(x.name) + '</a>' +
        (x.etf ? '<span class="tg etf">ETF</span>' : '') + tag + '</td>' +
        '<td class="mut ind">' + App.esc(x.ind || '—') + '</td><td>' + price(x.p) + '</td><td>' + App.pct(x.pct, 2) + '</td>' +
        '<td class="sorted">' + t[6](x, ctx) + '</td>' +
        '<td>' + (x.vr == null ? '—' : App.num(x.vr, 1)) + '</td><td class="mut">' + App.yi(x.amt) + '</td></tr>';
    }).join('') + '</tbody></table></div>';
}

/* 產業強弱：用全部有成交的（不套成交量門檻 —— 看的是整個族群），「漲最多」才套門檻 */
function industryTable(base) {
  var g = {};
  base.forEach(function (x) {
    var k = x.ind || '其他';
    var a = g[k] || (g[k] = { n: 0, up: 0, dn: 0, sum: 0, amt: 0, best: null });
    a.n++; a.sum += x.pct; a.amt += x.amt;
    if (x.pct > 0) a.up++; else if (x.pct < 0) a.dn++;
    if (x.vol >= LV.minVol && (!a.best || x.pct > a.best.pct)) a.best = x;
  });
  var list = Object.keys(g).filter(function (k) { return g[k].n >= 3; }).map(function (k) {
    var a = g[k]; a.k = k; a.avg = a.sum / a.n; return a;
  }).sort(function (a, b) { return b.avg - a.avg; });
  if (!list.length) return '<div class="empty"><div class="note">沒有資料。</div></div>';
  return '<div class="scroll"><table class="ltable"><thead><tr><th style="text-align:left">產業</th><th>檔數</th>' +
    '<th class="sorted">平均漲跌</th><th>上漲／下跌</th><th>成交值</th><th style="text-align:left">漲最多的</th></tr></thead><tbody>' +
    list.map(function (a) {
      var b = a.best;
      return '<tr><td style="text-align:left"><a href="#" data-ind="' + App.esc(a.k) + '">' + App.esc(a.k) + '</a></td><td>' + a.n + '</td>' +
        '<td class="sorted">' + App.pct(a.avg, 2) + '</td>' +
        '<td><span class="up">' + a.up + '</span>／<span class="dn">' + a.dn + '</span>' +
        '<div class="sm">上漲 ' + App.num(a.up / a.n * 100, 0) + '%</div></td><td class="mut">' + App.yi(a.amt) + '</td>' +
        '<td style="text-align:left">' + (b ? '<a href="stock?c=' + encodeURIComponent(b.code) + '">' + App.esc(b.name) + '</a> ' +
          App.pct(b.pct, 2) : '<span class="mut">—</span>') + '</td></tr>';
    }).join('') + '</tbody></table></div>' +
    '<p class="sm" style="margin:10px 0 0;white-space:normal">只列今天有成交 3 檔以上的產業。「漲最多的」套用上面的成交量門檻。</p>';
}

function breadthHtml(d, base) {
  var nUp = 0, nDn = 0, nFl = 0, lu = 0, ld = 0;
  base.forEach(function (x) {
    if (x.pct > 0) nUp++; else if (x.pct < 0) nDn++; else nFl++;
    if (x.lim === 1) lu++; else if (x.lim === -1) ld++;
  });
  var ix = '';
  if (d.index) {
    var z = d.index[0], y = d.index[1];
    ix = '<span class="ix">加權指數 ' + z.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' ' +
      '<span class="' + App.cls(z - y) + '">' + (z >= y ? '+' : '') + (z - y).toFixed(2) + '（' + App.num((z / y - 1) * 100, 2, true) + '%）</span></span>';
  }
  return '<div class="breadth">' + ix + '<span>上漲 <b class="up">' + nUp + '</b> 家</span><span>下跌 <b class="dn">' + nDn + '</b> 家</span>' +
    '<span>平盤 <b>' + nFl + '</b> 家</span><span>漲停 <b class="up">' + lu + '</b></span><span>跌停 <b class="dn">' + ld + '</b></span>' +
    '<span class="mut">（' + (LV.scope === 'etf' ? 'ETF' : LV.scope === 'stock' ? '上市股票' : '上市股票＋ETF') + '，今天有成交的 ' + base.length + ' 檔）</span></div>';
}

function render() {
  var d = LV.data, box = document.getElementById('lvbody');
  if (!d || !box) return;
  var all = enrich(d, LV.ref);
  var base = all.filter(inScope);
  var st = statusText(d);
  document.getElementById('lvstat').innerHTML = '<span class="lvst"><i class="' + st[0] + '"></i>' + App.esc(st[1]) + '</span>';
  document.getElementById('lvbreadth').innerHTML = breadthHtml(d, base);
  var t = BYKEY[LV.key];
  var needRef = /^(vratio|hi20|lo20|hi52|lo52|ind)$/.test(t[0]);
  var refNote = needRef && !LV.ref ? '<p class="note up" style="margin:0 0 10px">讀不到「平常」的參考數字（data/live_ref.json），這張榜暫時沒有資料。</p>' : '';
  var body, count = '';
  if (t[0] === 'ind') {
    body = industryTable(base);
  } else {
    var pool = base.filter(function (x) { return x.vol >= LV.minVol && (!LV.ind || (x.ind || '其他') === LV.ind); });
    var ctx = { totAmt: base.reduce(function (s, x) { return s + x.amt; }, 0) };
    var list = (t[4] ? pool.filter(t[4]) : pool).map(function (x) { return [t[5](x), x]; })
      .filter(function (a) { return a[0] != null && !isNaN(a[0]); })
      .sort(function (a, b) { return b[0] - a[0]; }).map(function (a) { return a[1]; });
    count = '共 ' + list.length + ' 檔' + (list.length > LV.n ? '，顯示前 ' + LV.n + ' 檔' : '');
    body = (LV.ind ? '<p style="margin:0 0 10px;font-size:14px">只看「' + App.esc(LV.ind) + '」 <a href="#" id="lvindx">看全部</a></p>' : '') +
      stockTable(list.slice(0, LV.n), t, ctx) +
      (list.length > LV.n ? '<button class="btn lvmore" id="lvmore" type="button">顯示更多</button>' : '');
  }
  box.innerHTML = '<div class="card"><h2>' + App.esc(t[1]) + '<span class="lbadge fact">現在的事實，不是預測</span></h2>' +
    '<p class="lead">' + t[2] + '</p>' + (count ? '<div class="meta" style="margin:-4px 0 10px">' + count + '</div>' : '') +
    refNote + body + '</div>';
  var more = document.getElementById('lvmore');
  if (more) more.addEventListener('click', function () { LV.n += 30; render(); });
  var indx = document.getElementById('lvindx');
  if (indx) indx.addEventListener('click', function (e) { e.preventDefault(); LV.ind = null; LV.n = 30; render(); });
  [].forEach.call(box.querySelectorAll('a[data-ind]'), function (a) {
    a.addEventListener('click', function (e) { e.preventDefault(); LV.ind = a.getAttribute('data-ind'); go('amount'); });
  });
}

/* 換榜不重新載入頁面（報價已經在手上），網址跟著變，上一頁也能回來 */
function go(key, noPush) {
  if (!BYKEY[key]) key = 'gain';
  if (key === 'ind') LV.ind = null;
  LV.key = key; LV.n = 30;
  document.title = '盤中排行 · ' + BYKEY[key][1];
  [].forEach.call(document.querySelectorAll('#lvside .litem'), function (a) { a.classList.toggle('on', a.getAttribute('data-k') === key); });
  var sel = document.getElementById('lvsel');
  if (sel) sel.value = key;
  if (!noPush && history.pushState) {
    try {
      var u = new URLSearchParams(location.search);       // 其他參數（本機測試的 worker=）留著
      u.set('s', key);
      history.pushState(null, '', 'live?' + u.toString());
    } catch (e) {}
  }
  render();
  if (!noPush && window.scrollY > 300) window.scrollTo(0, 0);
}
window.addEventListener('popstate', function () { go(App.qs('s') || 'gain', true); });

function load(manual) {
  if (LV.loading) return;
  LV.loading = true;
  var btn = document.getElementById('lvre');
  if (btn) btn.disabled = true;
  fetch(WORKER + '/live', { cache: 'no-store' }).then(function (r) {
    if (!r.ok) throw new Error('更新服務回應 ' + r.status);
    return r.json();
  }).then(function (d) {
    if (!d || !d.rows) throw new Error((d && (d.message || d.error)) || '回傳的資料格式不對');
    LV.data = d;
    render();
  }).catch(function (e) {
    var msg = /fetch/i.test(e.message) ? '連不上更新服務（Cloudflare Worker），請確認網路後再試。' : e.message;
    var el = document.getElementById(LV.data ? 'lvstat' : 'lvbody');
    if (el) el.innerHTML = '<span class="up">讀不到即時報價：' + App.esc(msg) + '</span>' + (LV.data ? '（下面是上一次的資料）' : '');
  }).then(function () {
    LV.loading = false;
    if (btn) btn.disabled = false;
    schedule();
  });
}
/* 只在交易時段、而且頁面在前景時自動更新：切到別的分頁就停，回來馬上補抓一次 */
function schedule() {
  clearTimeout(LV.timer);
  var s = session();
  if ((s.open || s.pre) && document.visibilityState === 'visible') LV.timer = setTimeout(load, REFRESH);
}
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && (session().open || session().pre)) load();
  else clearTimeout(LV.timer);
});

App.boot('live', function () {
  LV.key = BYKEY[App.qs('s')] ? App.qs('s') : 'gain';
  document.title = '盤中排行 · ' + BYKEY[LV.key][1];
  var vols = [[0, '不限'], [100, '100 張'], [500, '500 張'], [1000, '1,000 張'], [5000, '5,000 張']];
  document.getElementById('app').innerHTML =
    '<h1 style="font-size:30px;letter-spacing:-.03em;font-weight:500;margin:0 0 4px">盤中排行</h1>' +
    '<div class="meta" id="lvstat">讀取即時報價…</div>' +
    '<div id="lvbreadth"></div>' +
    '<div class="lvbar"><div class="grp chips" id="lvscope">' +
    [['all', '全部'], ['stock', '上市股票'], ['etf', 'ETF']].map(function (x) {
      return '<button type="button" class="chip' + (LV.scope === x[0] ? ' on' : '') + '" data-v="' + x[0] + '">' + x[1] + '</button>';
    }).join('') + '</div>' +
    '<label class="grp">成交量至少 <select class="snap" id="lvvol">' + vols.map(function (v) {
      return '<option value="' + v[0] + '"' + (LV.minVol === v[0] ? ' selected' : '') + '>' + v[1] + '</option>';
    }).join('') + '</select></label>' +
    '<button class="btn" id="lvre" type="button">重新整理</button></div>' +
    '<div class="lgrid">' + sideTabs() + '<div class="lmain" id="lvbody"><p class="mut">讀取中…</p></div></div>' +
    '<p class="keep" style="font-size:13px;color:var(--mut);margin:20px 0 0">這些是當下的事實排行，不是買賣建議，也沒有經過回測：' +
    '今天漲最多的，明天不一定還會漲。成交量太少的股票，一兩筆成交就能漲停或跌停，所以預設只看成交量 500 張以上的。' +
    '報價來自證交所即時資訊，約有幾十秒的延遲；量比、新高新低用的「平常」數字算到上一個交易日為止。</p>';
  document.getElementById('lvscope').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-v]');
    if (!b) return;
    LV.scope = b.getAttribute('data-v');
    [].forEach.call(this.querySelectorAll('button'), function (x) { x.classList.toggle('on', x === b); });
    LV.n = 30; savePref(); render();
  });
  document.getElementById('lvvol').addEventListener('change', function () {
    LV.minVol = +this.value; LV.n = 30; savePref(); render();
  });
  document.getElementById('lvre').addEventListener('click', function () { load(true); });
  document.getElementById('lvside').addEventListener('click', function (e) {
    var a = e.target.closest('a[data-k]');
    if (!a || e.ctrlKey || e.metaKey || e.shiftKey) return;
    e.preventDefault();
    LV.ind = null;
    go(a.getAttribute('data-k'));
  });
  document.getElementById('lvsel').addEventListener('change', function () { LV.ind = null; go(this.value); });
  // 參考值跟報價同時讀；參考值讀不到只影響量比、新高新低、產業三種榜
  App.get('live_ref.json').then(function (r) { LV.ref = r; render(); }, function () { render(); });
  load();
});
</script>
</body></html>
