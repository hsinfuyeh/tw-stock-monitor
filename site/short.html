<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>/* 在 body 渲染前就套用主題，避免切換時閃一下白底 */
(function(){try{var t=localStorage.getItem('theme');
if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/style.css">
<title>今日名單</title>
<style>
.pscore td{font-variant-numeric:tabular-nums}
.pscore td.hi{color:var(--fg);font-weight:500}
.pscore td.lo{color:var(--faint)}
.funnel{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13.5px;color:var(--mut)}
.funnel b{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
</style></head><body>
<div class="wrap" id="app"></div>
<script src="assets/app.js"></script>
<script src="assets/stable.js"></script>
<script>
/* 今日名單：穩定強勢股，每天 10 檔（stable.py，RESEARCH_LOG 第 11 輪）。
 *
 * 這一頁不做任何計算，全部來自 stable/today.json。
 * 不顯示停利停損、不給買賣建議 —— 使用者要的是「每天的潛力股名單」。 */
function bar(c, cls, txt) {
  return '<div class="statusbar ' + cls + '"><span class="txt">' + txt + '</span></div>';
}

function scoreTable(T) {
  var F = T.factors;
  return '<div class="scroll"><table class="pscore"><thead><tr><th>名次</th><th style="text-align:left">股票</th>' +
    F.map(function (f) { return '<th><span class="tip" tabindex="0" data-tip="' + App.esc(f.desc) + '">' + App.esc(f.name) + '</span></th>'; }).join('') +
    '<th class="sorted">總分</th></tr></thead><tbody>' +
    T.rows.map(function (r) {
      return '<tr><td>' + r.rank + '</td><td style="text-align:left"><a href="stock.html?c=' + r.code + '"><strong>' +
        r.code + '</strong></a> ' + App.esc(r.name) + '</td>' +
        F.map(function (f) {
          var v = r.parts[f.key];
          return '<td class="' + (v >= 80 ? 'hi' : v <= 30 ? 'lo' : '') + '">' + (v == null ? '—' : v) + '</td>';
        }).join('') + '<td class="sorted">' + App.num(r.score, 1) + '</td></tr>';
    }).join('') + '</tbody></table></div>';
}

function detailTable(T) {
  return '<div class="scroll"><table><thead><tr><th>名次</th><th>代號</th><th style="text-align:left">名稱</th><th>產業</th>' +
    '<th>收盤</th><th>近 20 日</th><th>近 60 日</th><th>' + App.tip('每天震盪', 'ATR') + '</th>' +
    '<th>' + App.tip('日均成交額') + '</th><th>上榜</th><th style="text-align:left">入選原因</th></tr></thead><tbody>' +
    T.rows.map(function (r) {
      return '<tr><td>' + r.rank + '</td><td><a href="stock.html?c=' + r.code + '"><strong>' + r.code + '</strong></a></td>' +
        '<td style="text-align:left">' + App.esc(r.name) + '</td><td class="mut">' + App.esc(r.ind || '—') + '</td>' +
        '<td>' + Stable.f2(r.close) + '</td><td>' + App.pct(r.ret20, 1) + '</td><td>' + App.pct(r.ret60, 1) + '</td>' +
        '<td>' + App.num(r.atrp, 1) + '%</td><td>' + App.num(r.adtv20, 2) + ' 億</td>' +
        '<td>' + (r.streak <= 1 ? '<span class="nbadge new" style="margin:0">新</span>' : r.streak + ' 天') + '</td>' +
        '<td class="why">' + App.esc((r.why || []).join('；')) + '</td></tr>';
    }).join('') + '</tbody></table></div>';
}

function funnel(T) {
  var c = T.counts, n = {};
  T.exclude.forEach(function (x) { n[x.key] = x.name; });
  var parts = Object.keys(c.excluded).filter(function (k) { return c.excluded[k] > 0; }).map(function (k) {
    return (k === 'risk' ? '處置／注意／全額交割' : n[k] || k) + ' <b>' + c.excluded[k] + '</b>';
  });
  return '<div class="funnel"><span>成交額前 300 名 <b>' + c.universe + '</b> 檔</span>' +
    '<span>→ ' + App.tip('穩定池') + ' <b>' + c.pool + '</b> 檔</span>' +
    '<span>→ 名單 <b>' + T.rows.length + '</b> 檔</span></div>' +
    '<p class="note" style="font-size:13px;margin-top:8px">被刷掉的原因（一檔可能同時符合好幾條）：' + parts.join('、') + '</p>';
}

App.boot('short', function (meta) {
  return Promise.all([App.get('stable/today.json'), App.get('stable/backtest.json').catch(function () { return null; })])
  .then(function (res) {
    var T = res[0], B = res[1];
    document.title = '今日名單 · ' + T.date;
    var notes = [];
    var rn = Stable.riskNote(T), mn = Stable.marginNote(T);
    if (rn) notes.push(bar('', 'warn', '<b>' + rn + '</b>'));
    if (mn) notes.push(bar('', 'warn', mn));
    var verdict = T.passed
      ? '回測（2008–2025）通過淘汰關卡：名單的「' + App.tip('中減倒') + '」比穩定池隨便挑多 ' +
        (B && B.all ? App.num(B.all.diff, 1) + ' 個百分點（' + App.tip('t 值') + ' ' + App.num(B.all.t, 1) + '）' : '一點') +
        '。優勢不大' + (B && B.periods && B.periods['2026'] && B.periods['2026'].diff <= 0 ? '，而且 2026 年沒有比隨便挑好' : '') +
        '；真正的成績看<a href="history.html">名單成績</a>。'
      : '回測（2008–2025）<b>沒有</b>通過淘汰關卡，名單照常列出，但請當成參考。';

    var dropped = T.dropped && T.dropped.length
      ? '<p class="note" style="font-size:13.5px">' + App.esc(T.prev_day || '前一天') + ' 在榜、今天掉出：' +
        T.dropped.map(function (d) { return '<a href="stock.html?c=' + d.code + '">' + d.code + ' ' + App.esc(d.name || '') + '</a>'; }).join('、') + '</p>'
      : '';

    document.getElementById('app').innerHTML =
      '<h1 style="font-size:30px;letter-spacing:-.03em;font-weight:500;margin:0 0 4px">今日名單</h1>' +
      '<div class="meta">' + App.esc(T.date) + ' 收盤後 ｜ 穩定強勢股 ' + T.rows.length + ' 檔 ｜ 看的是接下來 10 個交易日</div>' +
      notes.join('') +
      bar('', 'ok', Stable.baseline(T)) +
      bar('', T.passed ? 'ok' : 'warn', verdict) +
      '<div class="card"><h2>今天的 ' + T.rows.length + ' 檔</h2>' +
      '<p class="lead">從成交額前 300 名的上市股票裡，先刷掉波動大、常漲停、常跳空、爆量、已經漲太多、融資暴增和被交易所點名的股票，' +
      '剩下的依 9 個「動能強又穩定」的指標排序。名單不是買賣建議，也不附停利停損。</p>' +
      (T.rows.length ? '<div class="hcards">' + T.rows.map(Stable.card).join('') + '</div>'
        : '<div class="empty"><div class="note">今天穩定池裡沒有股票。</div></div>') +
      dropped + '</div>' +
      '<div class="card"><h2>名單明細</h2>' + detailTable(T) + '</div>' +
      '<div class="card"><h2>分數怎麼來的</h2>' +
      '<p class="lead">每個指標都是在今天的穩定池裡排名次，換成 0–100（100 = 池子裡最好）。總分是 9 個指標的平均，' +
      '權重一律相同 —— 看過結果才調的權重不能用。滑到指標名稱上看說明。</p>' + scoreTable(T) + '</div>' +
      '<div class="card"><h2>今天刷掉了誰</h2>' + funnel(T) + '</div>';
    App.pager(document.getElementById('app'));
  });
});
</script>
</body></html>
