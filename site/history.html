<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>/* 在 body 渲染前就套用主題，避免切換時閃一下白底 */
(function(){try{var t=localStorage.getItem('theme');
if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/style.css">
<title>名單成績</title>
<style>
#daylist tr{cursor:pointer}
/* 選中的那一天：淺灰底加粗。原本是 --line2（淺色模式是純黑），黑字就看不見了 */
#daylist tr.on td{background:var(--sunk);font-weight:500}
</style>
</head><body>
<div class="wrap" id="app"></div>
<script src="assets/app.js"></script>
<script>
/* 名單成績（前瞻實測）：每天的名單存成快照（snapshots/stable/），10 個交易日後自動對答案。
 * 這是唯一沒被研究看過的資料，所以是真正的成績單。資料來自 stable/track.json。 */
var ST = { '中': 'st-hit', '倒': 'st-fail' };
function pp(v) { return v == null ? '—' : App.num(v, 1) + '%'; }
function pt(v) { return v == null ? '—' : '<span class="' + App.cls(v) + '">' + App.num(v, 1, true) + '</span>'; }

/* 每天一格：紅 = 名單贏隨便挑、綠 = 輸、淺灰 = 平手、灰 = 還沒對完答案（台股慣例紅好綠壞） */
function strip(D) {
  if (!D.length) return '';
  var cells = D.slice().reverse().map(function (h) {
    var c = h.diff == null ? '' : h.diff > 0 ? 'w' : h.diff < 0 ? 'l' : 'e';
    return '<i class="' + c + '" title="' + h.date + (h.diff == null ? ' 未完' : ' 多出 ' + App.num(h.diff, 1, true)) + '"></i>';
  }).join('');
  return '<div class="strip">' + cells + '</div><div class="vs"><div class="key">' +
    '<span><i style="background:var(--up)"></i>贏隨便挑</span><span><i style="background:var(--dn)"></i>輸</span>' +
    '<span><i style="background:var(--line2)"></i>還沒對完</span></div></div>';
}

function count(h, s) { return h.rows.filter(function (r) { return r.status === s; }).length; }

function detail(h) {
  return '<h3 style="font-size:17px;margin:22px 0 6px">' + h.date + ' 的名單' + bfTag(h) + '</h3>' +
    '<div class="scroll"><table><thead><tr><th>名次</th><th>代號</th><th style="text-align:left">名稱</th>' +
    '<th>狀態</th><th>第幾天</th><th class="sorted">從隔天開盤算起的漲跌</th></tr></thead><tbody>' +
    h.rows.map(function (r) {
      return '<tr><td>' + (r.rank || '—') + '</td><td><a href="stock?c=' + r.code + '"><strong>' + r.code + '</strong></a></td>' +
        '<td style="text-align:left">' + App.esc(r.name) + '</td><td class="' + (ST[r.status] || '') + '">' + App.esc(r.status) + '</td>' +
        '<td>' + (r.day ? r.day + ' / 10' : '—') + '</td><td class="sorted">' + (r.ret == null ? '—' : App.pct(r.ret, 2)) + '</td></tr>';
    }).join('') + '</tbody></table></div>' +
    '<p class="note" style="font-size:13px">「中」「倒」一旦出現就不會再變；漲跌停在分出結果的那一天。進行中的是到最新收盤為止。</p>';
}

/* 補算：那天沒有人更新網站，名單是之後用當天的資料重算的（stable.backfill）。
   處置股名單只查得到「現在」的，所以補算的那天沒有套用處置股排除。 */
function bfTag(h) {
  return h.backfilled ? ' <span class="nbadge run">' + App.tip('補算') + '</span>' : '';
}

/* 影子名單（shadow.py）：新的排除條件跟名單並行測試，不取代名單、不動名單的實測。
   沒有登記任何影子名單時整區不出現。 */
function pairRow(name, x) {
  if (!x) return '';
  return '<tr><td style="text-align:left">' + name + '</td><td>' + x.days + '</td>' +
    '<td class="mut">' + pp(x.hit0) + '／' + pp(x.fail0) + '</td><td>' + pp(x.hit1) + '／' + pp(x.fail1) + '</td>' +
    '<td class="mut">' + x.changed_days + '</td><td class="sorted">' + pt(x.diff) + '</td>' +
    '<td>' + (x.t == null ? '—' : App.num(x.t, 2) + '<br><span class="mut" style="font-size:12px">運氣機率 ' + App.luck(x.t) + '</span>') + '</td></tr>';
}
function shadowCard(v) {
  var bt = v.backtest, f = v.vs_main || {}, T = v.track || {};
  var since = v.demo ? '（示範版從名單的第一天起在本機算，不存檔）' : '登記日 ' + App.esc(v.registered);
  var btHtml = !bt ? '<p class="note">這個條件的資料沒有歷史，只能看上線後的成績。</p>' :
    '<h3 style="font-size:16px;margin:16px 0 6px">回測：同一天配對比較</h3>' +
    '<div class="scroll"><table><thead><tr><th style="text-align:left">期間</th><th>天數</th><th>原名單 中／倒</th>' +
    '<th>影子名單 中／倒</th><th>名單有變的天數</th><th class="sorted">影子多出的' + App.tip('中減倒') + '</th><th>' + App.tip('t 值') + '</th></tr></thead><tbody>' +
    pairRow('2008–2025 合計', bt.all) +
    [['2008–2018', '2008–2018'], ['2019–2025', '2019–2025'], ['2026', '2026']].map(function (k) { return pairRow(k[0], bt.periods[k[1]]); }).join('') +
    '</tbody></table></div>' +
    '<p class="note" style="font-size:13px">每一天用同一個穩定池，原名單跟影子名單各挑 10 檔，比兩邊的（中 − 倒）。' +
    '大盤好壞兩邊一起受，互相抵銷。兩段期間都大於 0、合計 t 值 ≥ 3 才算通過回測。但通過也不代表有效，只代表跟歷史不矛盾，真正的成績看下面的前瞻。</p>';
  var fw = '<h3 style="font-size:16px;margin:16px 0 6px">前瞻：上線後每天對答案</h3>' +
    '<div class="stats"><div class="stat"><h3>影子名單</h3><div class="sub">' + since + '</div><dl>' +
    '<dt>已對完的天數</dt><dd>' + (T.finished || 0) + ' / ' + (T.days || 0) + '</dd>' +
    '<dt>中</dt><dd>' + pp(T.hit) + '</dd><dt>倒</dt><dd>' + pp(T.fail) + '</dd></dl></div>' +
    '<div class="stat"><h3>跟原名單比</h3><div class="sub">兩份都對完答案的日子</div><dl>' +
    '<dt>天數</dt><dd>' + (f.days || 0) + '</dd><dt>影子多出的中減倒</dt><dd>' + pt(f.diff) + '</dd>' +
    '<dt>t 值</dt><dd>' + (f.t == null ? '還太少' : App.num(f.t, 2)) + '</dd>' +
    '<dt>運氣機率</dt><dd>' + (f.t == null ? '還太少' : App.luck(f.t)) + '</dd></dl></div></div>';
  var today = (v.today || []).map(function (r) {
    return '<a href="stock?c=' + r.code + '">' + r.code + ' ' + App.esc(r.name) + '</a>';
  }).join('、');
  return '<div class="card"><h2>影子名單：' + App.esc(v.name) + (v.demo ? ' <span class="nbadge run">示範</span>' : '') + '</h2>' +
    '<p class="lead">' + App.esc(v.desc) + '名單規則（排序、10 檔、同產業最多 3 檔）跟原名單一樣，差別只有多刷掉的股票。' +
    '原名單和它的成績完全不受影響。</p>' + btHtml + fw +
    (today ? '<p style="font-size:13.5px;margin-top:12px"><b>今天的影子名單：</b>' + today + '</p>' : '') + '</div>';
}
function renderShadow(S) {
  var vs = (S && S.variants) || [];
  if (!vs.length) return;
  var box = document.createElement('div');
  box.innerHTML = '<h2 style="font-size:22px;font-weight:500;margin:34px 0 4px">影子名單</h2>' +
    '<div class="meta">新的排除條件跟名單並行測試，不取代名單</div>' + vs.map(shadowCard).join('');
  document.getElementById('app').appendChild(box);
}

App.boot('history', function (meta) {
  return App.get('stable/track.json').then(function (K) {
    var S = K.summary, D = K.days;
    var prog = S.finished + ' / ' + S.target_days;
    var head = !S.finished
      ? '從 <b>' + App.esc(S.start || K.date) + '</b> 開始，每天的名單都存下來，10 個交易日後自動對答案。' +
        '目前還沒有任何一天走完 10 天，第一筆成績大約兩週後出現。'
      : '從 ' + App.esc(S.start) + ' 起，已經有 <b>' + S.finished + '</b> 天的名單對完答案：名單中 ' + pp(S.hit) + '、倒 ' + pp(S.fail) +
        '；同一天穩定池隨便挑是中 ' + pp(S.pool_hit) + '、倒 ' + pp(S.pool_fail) + '。';
    document.getElementById('app').innerHTML =
      '<h1 style="font-size:30px;letter-spacing:-.03em;font-weight:500;margin:0 0 4px">名單成績</h1>' +
      '<div class="meta">每天的名單 10 個交易日後對答案 ｜ 資料到 ' + App.esc(K.date) + '</div>' +
      '<div class="statusbar ok"><span class="txt">' + head + '</span></div>' +
      '<div class="card"><h2>到目前為止</h2><div class="stats">' +
      '<div class="stat"><h3>名單</h3><div class="sub">已對完答案的每一檔</div><dl>' +
      '<dt>' + App.tip('中') + '</dt><dd>' + pp(S.hit) + '</dd><dt>' + App.tip('倒') + '</dt><dd>' + pp(S.fail) + '</dd></dl></div>' +
      '<div class="stat"><h3>穩定池隨便挑</h3><div class="sub">同一天、同一群股票</div><dl>' +
      '<dt>中</dt><dd>' + pp(S.pool_hit) + '</dd><dt>倒</dt><dd>' + pp(S.pool_fail) + '</dd></dl></div>' +
      '<div class="stat"><h3>判定</h3><div class="sub">滿 ' + S.target_days + ' 天、' + App.tip('t 值') + ' ≥ ' + S.target_t + ' 才算有效</div><dl>' +
      '<dt>多出的' + App.tip('中減倒') + '</dt><dd>' + pt(S.diff) + '</dd>' +
      '<dt>t 值</dt><dd>' + (S.t == null ? '還太少' : App.num(S.t, 2)) + '</dd>' +
      '<dt>' + App.tip('運氣機率') + '</dt><dd>' + (S.t == null ? '還太少' : App.luck(S.t)) + '</dd>' +
      '<dt>進度</dt><dd>' + prog + ' 天</dd></dl></div></div>' +
      '<div class="prog" title="已對完答案的天數"><i style="width:' + Math.min(100, S.finished / S.target_days * 100).toFixed(1) + '%"></i></div>' +
      '<div class="mut" style="font-size:12.5px">還要約 ' + Math.max(0, S.target_days - S.finished) + ' 個交易日才滿 ' + S.target_days + ' 天（約 ' +
      Math.ceil(Math.max(0, S.target_days - S.finished) / 21) + ' 個月）</div>' +
      '<p class="note" style="font-size:13.5px">門檻訂得高，是因為回測用的資料已經被研究過很多次。代價是：就算名單真的有一點優勢，一年內也很可能判不出來。</p></div>' +
      '<div class="card"><h2>每天的名單</h2>' + strip(D) +
      (D.length ? '<div class="scroll" data-per="20"><table class="stk"><thead><tr><th>名單日期</th><th>檔數</th><th>中</th><th>倒</th><th>平</th>' +
        '<th>進行中</th><th>穩定池 中／倒</th><th class="sorted">多出的中減倒</th></tr></thead><tbody id="daylist">' +
        D.map(function (h, i) {
          var going = h.n - h.done;
          return '<tr data-i="' + i + '"><td><a href="#">' + h.date + '</a>' + bfTag(h) + '</td><td>' + h.n + '</td>' +
            '<td class="st-hit">' + h.hit + '</td><td class="st-fail">' + h.fail + '</td><td>' + count(h, '平') + '</td>' +
            '<td class="mut">' + (going || '—') + '</td><td class="mut">' + pp(h.pool_hit) + '／' + pp(h.pool_fail) + '</td>' +
            '<td class="sorted">' + (h.diff == null ? '<span class="mut">未完</span>' : pt(h.diff)) + '</td></tr>';
        }).join('') + '</tbody></table></div><div id="det"></div>'
        : '<p class="note">還沒有任何一天的名單。</p>') + '</div>';
    var tb = document.getElementById('daylist');
    function show(i) {
      [].forEach.call(tb.children, function (tr) { tr.classList.toggle('on', +tr.getAttribute('data-i') === i); });
      document.getElementById('det').innerHTML = detail(D[i]);
    }
    if (tb) {
      tb.addEventListener('click', function (e) {
        var tr = e.target.closest('tr');
        if (!tr) return;
        e.preventDefault();
        show(+tr.getAttribute('data-i'));
      });
      show(0);
    }
    App.pager(document.getElementById('app'));
    // 影子名單：檔案不存在（舊版網站）或沒有登記任何影子名單就什麼都不顯示
    return App.get('stable/shadow.json').then(renderShadow, function () {});
  });
});
</script>
</body></html>
