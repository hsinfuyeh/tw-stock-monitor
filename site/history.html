<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>/* 在 body 渲染前就套用主題，避免切換時閃一下白底 */
(function(){try{var t=localStorage.getItem('theme');
if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/style.css">
<title>名單成績</title>
<style>
#daylist tr{cursor:pointer}
#daylist tr.on td{background:var(--line2)}
</style>
</head><body>
<div class="wrap" id="app"></div>
<script src="assets/app.js"></script>
<script>
/* 名單成績（前瞻實測）：每天的名單存成快照（snapshots/stable/），10 個交易日後自動對答案。
 * 這是唯一沒被研究看過的資料，所以是真正的成績單。資料來自 stable/track.json。 */
var ST = { '中': 'st-hit', '倒': 'st-fail' };
function pp(v) { return v == null ? '—' : App.num(v, 1) + '%'; }
function pt(v) { return v == null ? '—' : '<span class="' + App.cls(v) + '">' + App.num(v, 1, true) + '</span>'; }

function count(h, s) { return h.rows.filter(function (r) { return r.status === s; }).length; }

function detail(h) {
  return '<h3 style="font-size:17px;margin:22px 0 6px">' + h.date + ' 的名單</h3>' +
    '<div class="scroll"><table><thead><tr><th>名次</th><th>代號</th><th style="text-align:left">名稱</th>' +
    '<th>狀態</th><th>第幾天</th><th class="sorted">從隔天開盤算起的漲跌</th></tr></thead><tbody>' +
    h.rows.map(function (r) {
      return '<tr><td>' + (r.rank || '—') + '</td><td><a href="stock.html?c=' + r.code + '"><strong>' + r.code + '</strong></a></td>' +
        '<td style="text-align:left">' + App.esc(r.name) + '</td><td class="' + (ST[r.status] || '') + '">' + App.esc(r.status) + '</td>' +
        '<td>' + (r.day ? r.day + ' / 10' : '—') + '</td><td class="sorted">' + (r.ret == null ? '—' : App.pct(r.ret, 2)) + '</td></tr>';
    }).join('') + '</tbody></table></div>' +
    '<p class="note" style="font-size:13px">「中」「倒」一旦出現就不會再變；漲跌停在分出結果的那一天。進行中的是到最新收盤為止。</p>';
}

App.boot('history', function (meta) {
  return App.get('stable/track.json').then(function (K) {
    var S = K.summary, D = K.days;
    var prog = S.finished + ' / ' + S.target_days;
    var head = !S.finished
      ? '從 <b>' + App.esc(S.start || K.date) + '</b> 開始，每天的名單都存下來，10 個交易日後自動對答案。' +
        '目前還沒有任何一天走完 10 天，第一筆成績大約兩週後出現。'
      : '從 ' + App.esc(S.start) + ' 起，已經有 <b>' + S.finished + '</b> 天的名單對完答案：名單中 ' + pp(S.hit) + '、倒 ' + pp(S.fail) +
        '；同一天穩定池隨便挑是中 ' + pp(S.pool_hit) + '、倒 ' + pp(S.pool_fail) + '。';
    document.getElementById('app').innerHTML =
      '<h1 style="font-size:30px;letter-spacing:-.03em;font-weight:500;margin:0 0 4px">名單成績</h1>' +
      '<div class="meta">每天的名單 10 個交易日後對答案 ｜ 資料到 ' + App.esc(K.date) + '</div>' +
      '<div class="statusbar ok"><span class="txt">' + head + '</span></div>' +
      '<div class="card"><h2>到目前為止</h2><div class="stats">' +
      '<div class="stat"><h3>名單</h3><div class="sub">已對完答案的每一檔</div><dl>' +
      '<dt>' + App.tip('中') + '</dt><dd>' + pp(S.hit) + '</dd><dt>' + App.tip('倒') + '</dt><dd>' + pp(S.fail) + '</dd></dl></div>' +
      '<div class="stat"><h3>穩定池隨便挑</h3><div class="sub">同一天、同一群股票</div><dl>' +
      '<dt>中</dt><dd>' + pp(S.pool_hit) + '</dd><dt>倒</dt><dd>' + pp(S.pool_fail) + '</dd></dl></div>' +
      '<div class="stat"><h3>判定</h3><div class="sub">滿 ' + S.target_days + ' 天、' + App.tip('t 值') + ' ≥ ' + S.target_t + ' 才算有效</div><dl>' +
      '<dt>多出的' + App.tip('中減倒') + '</dt><dd>' + pt(S.diff) + '</dd>' +
      '<dt>t 值</dt><dd>' + (S.t == null ? '還太少' : App.num(S.t, 2)) + '</dd>' +
      '<dt>進度</dt><dd>' + prog + ' 天</dd></dl></div></div>' +
      '<p class="note" style="font-size:13.5px">門檻訂得高，是因為回測用的資料已經被研究過很多次。代價是：就算名單真的有一點優勢，一年內也很可能判不出來。</p></div>' +
      '<div class="card"><h2>每天的名單</h2>' +
      (D.length ? '<div class="scroll" data-per="20"><table><thead><tr><th>名單日期</th><th>檔數</th><th>中</th><th>倒</th><th>平</th>' +
        '<th>進行中</th><th>穩定池 中／倒</th><th class="sorted">多出的中減倒</th></tr></thead><tbody id="daylist">' +
        D.map(function (h, i) {
          var going = h.n - h.done;
          return '<tr data-i="' + i + '"><td><a href="#">' + h.date + '</a></td><td>' + h.n + '</td>' +
            '<td class="st-hit">' + h.hit + '</td><td class="st-fail">' + h.fail + '</td><td>' + count(h, '平') + '</td>' +
            '<td class="mut">' + (going || '—') + '</td><td class="mut">' + pp(h.pool_hit) + '／' + pp(h.pool_fail) + '</td>' +
            '<td class="sorted">' + (h.diff == null ? '<span class="mut">未完</span>' : pt(h.diff)) + '</td></tr>';
        }).join('') + '</tbody></table></div><div id="det"></div>'
        : '<p class="note">還沒有任何一天的名單。</p>') + '</div>';
    var tb = document.getElementById('daylist');
    function show(i) {
      [].forEach.call(tb.children, function (tr) { tr.classList.toggle('on', +tr.getAttribute('data-i') === i); });
      document.getElementById('det').innerHTML = detail(D[i]);
    }
    if (tb) {
      tb.addEventListener('click', function (e) {
        var tr = e.target.closest('tr');
        if (!tr) return;
        e.preventDefault();
        show(+tr.getAttribute('data-i'));
      });
      show(0);
    }
    App.pager(document.getElementById('app'));
  });
});
</script>
</body></html>
