# Cloudflare Worker 設定（npx wrangler deploy 會讀這個檔）。說明見 README.md。
name = "tw-stock-monitor-cron"
main = "worker.js"
compatibility_date = "2026-09-01"

# 要有網址：網頁的更新按鈕打 /update、/status，並透過 /ptt/... 讀 PTT 股票板
workers_dev = true
preview_urls = false

[vars]
GH_REPO = "hsinfuyeh/tw-stock-monitor"
GH_WORKFLOW = "update.yml"

# 沒有定時排程（2026-10-01 起）：更新只在有人按 ⟳、或打開網頁發現資料過期時觸發。
# 明確寫成空的，wrangler deploy 才會把 Cloudflare 上原本登記的排程一併刪掉。
[triggers]
crons = []

[observability]
enabled = true          # 在 Cloudflare 後台的 Logs 看得到每次觸發成功或失敗
