name: 更新資料並發佈

# 沒有定時排程（2026-10-01 起全部拿掉：GitHub 排程常常延遲或整個略過，
# 而且使用者要的是「看的時候是新的」）。只有兩種觸發方式，都經過 Cloudflare Worker（cloudflare/worker.js）：
#
#   按 ⟳    網頁右上角的更新鈕（trigger=manual）。瀏覽器先讀 PTT 算好社群聲量一起送來；
#           行情沒有新東西時走快速通道，只重算社群聲量，整次約 1 分鐘。
#   開網頁  網頁發現「照時間應該有新資料了，但網站還是舊的」就自動觸發（trigger=cron）。
#           比照舊的排程：證交所還沒發完就安靜略過（綠燈），當天發佈過就不重做。
#
# 也可以在 Actions 分頁按 Run workflow（或 gh workflow run），等同按 ⟳（不含社群聲量）。
# 勾 backfill 是「補歷史」：補上櫃與主動式 ETF 的舊資料（平常的更新只抓新的日子），手動跑。
on:
  workflow_dispatch:
    inputs:
      ignore_gate:
        description: "忽略資料齊備檢查（TWSE 還沒發完就強制發佈，除錯用）"
        type: boolean
        default: false
      trigger:
        # 網頁自動觸發時帶 cron：比照舊的排程處理 —— 當天已經發佈過、也沒有新的融資券就直接略過。
        # 按 ⟳ 的是 manual：沒有新資料也照樣發佈（快速通道或完整產出）。
        description: "觸發來源（cron = 網頁發現資料過期而自動觸發，比照排程；手動請留 manual）"
        type: string
        default: manual
      backfill:
        # 補上櫃（目標 300 個交易日）與主動式 ETF（60 天）的歷史。平常的更新只抓新的日子，
        # 歷史由這個選項另外補：每次約 40 分鐘，補不完就再跑一次（已經抓過的會跳過）。
        description: "補歷史（上櫃與主動式 ETF，約 40 分鐘，期間其他更新會排隊）"
        type: boolean
        default: false
      social:
        # 網頁按「更新」時，瀏覽器算好的 PTT 聲量（JSON）。由 Cloudflare Worker 的 /update 帶進來，
        # social.apply_payload 檢查後併進 snapshots/social/ptt.json。手動跑請留空。
        description: "社群聲量（網頁更新按鈕自動帶入，手動請留空）"
        type: string
        default: ""

# 同時只允許一個，避免排程與手動撞在一起把倉儲寫壞
concurrency:
  group: update
  cancel-in-progress: false

permissions:
  contents: write     # 每日清單快照要 commit 回 repo
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 倉儲快取（壓實後約 271 MB）。還原與保存拆開：
      # 只有資料真的變了才存新的一份，否則一天五次排程會堆出一堆一樣的快取。
      #
      # 前綴帶著資料起點（warehouse2008-）。2026-09-21 把歷史補到 2008 之後，
      # 舊前綴的快取裝的是 2019 起的倉儲，restore-keys 會繼續命中它，
      # CI 就永遠停在 7 年資料、線上回測跟本機對不起來 —— 而且不會有任何錯誤。
      # 換前綴等於讓舊快取失效，強制從新的 Release 種子重新開始。
      - name: 還原倉儲快取
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data
            raw
          key: warehouse2008-${{ github.run_id }}
          restore-keys: warehouse2008-

      # 冷啟動（快取過期或第一次跑）沒有倉儲可用。
      # 從零回補要好幾個小時，會超過 job 上限，所以從 Release 下載種子。
      - name: 沒有倉儲時下載種子
        if: steps.cache.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release download warehouse-seed --pattern 'seed.tar.gz' --dir . --clobber 2>/dev/null; then
            tar xzf seed.tar.gz && rm seed.tar.gz
            echo "已從 Release 取得種子（倉儲 + 月營收）"
            ls -lh data/
            echo "月營收 $(ls raw/revenue_mops 2>/dev/null | wc -l) 個月（沒有的話 ci_update 會自己補）"
          else
            echo "::error::找不到倉儲快取，也沒有 warehouse-seed 這個 Release。"
            echo "::error::請先在本機執行 python seed.py 上傳種子（見 README）。"
            exit 1
          fi

      - name: 抓取新資料
        id: fetch
        env:
          # 社群聲量的 Threads 來源（social.py）。沒設這個 Secret 就只用 PTT，不會出錯。
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          TRIGGER: ${{ inputs.trigger || github.event_name }}
          SOCIAL_PAYLOAD: ${{ inputs.social }}
          BACKFILL: ${{ inputs.backfill }}
        run: python ci_update.py ${{ inputs.ignore_gate && '--ignore-gate' || '' }}

      # publish=false 時下面全部跳過（綠燈而不是紅燈）：
      #   資料還沒發完 —— 下一個整點再試
      #   排程時發現沒有新交易日 —— 今天已經發佈過了
      # 標成失敗會讓人開始習慣性忽略紅色叉叉。
      # 快速通道（ci_update 設 light=true：資料沒有任何新東西，只有社群聲量會變）。
      # 找「同一個資料日期、同一份程式碼」上次完整產出的 site/data；找得到就只重算社群聲量
      # 那兩張榜（幾秒），不必再花 4 分鐘重建整個網站。改過程式或網頁檔，鍵就對不上，照舊完整產出。
      - name: 還原上次產出的網站
        id: sitecache
        if: steps.fetch.outputs.publish == 'true' && steps.fetch.outputs.light == 'true'
        uses: actions/cache/restore@v4
        with:
          path: site/data
          key: site-${{ steps.fetch.outputs.data_date }}-${{ hashFiles('*.py', 'requirements.txt', 'site/*.html', 'site/assets/**') }}-${{ github.run_id }}
          restore-keys: site-${{ steps.fetch.outputs.data_date }}-${{ hashFiles('*.py', 'requirements.txt', 'site/*.html', 'site/assets/**') }}-

      # 快速通道失敗（例如快取內容不完整）就退回完整產出，不讓這次更新失敗
      - name: 只更新社群聲量（快速通道）
        id: light
        if: steps.sitecache.outputs.cache-matched-key != ''
        run: python publish.py --social-only || { echo "::warning::快速通道失敗，改成完整產出"; python publish.py; echo "full=true" >> "$GITHUB_OUTPUT"; }

      - name: 產出網站
        id: build
        if: steps.fetch.outputs.publish == 'true' && steps.sitecache.outputs.cache-matched-key == ''
        run: python publish.py

      # 完整產出的結果存起來給快速通道用（約 8 MB）。鍵裡的程式碼雜湊只算版控裡的檔案，
      # 跟上面還原時是同一個算式；site/data 是產出來的、不在算式裡。
      - name: 保存產出的網站
        if: steps.build.outcome == 'success' || steps.light.outputs.full == 'true'
        uses: actions/cache/save@v4
        with:
          path: site/data
          key: site-${{ steps.fetch.outputs.data_date }}-${{ hashFiles('*.py', 'requirements.txt', 'site/*.html', 'site/assets/**') }}-${{ github.run_id }}

      - if: steps.fetch.outputs.publish == 'true'
        uses: actions/configure-pages@v5
      - if: steps.fetch.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        if: steps.fetch.outputs.publish == 'true'
        uses: actions/deploy-pages@v4

      # 每日清單快照（PRD：每天存一份當日清單）。網站每次都是整個重新產生，
      # 快照只放在網站上會在下一次部署時消失，所以 commit 回 repo 的 snapshots/。
      # 附帶好處：repo 每個交易日都有 commit，GitHub 不會因為 60 天沒活動停用排程。
      # 失敗不擋住後面的快取保存（網站已經部署了），但要留下明顯的警告。
      - name: 保存每日清單快照
        if: steps.fetch.outputs.publish == 'true'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots
          if git diff --cached --quiet; then
            echo "快照沒有變化"
          else
            git commit -m "每日名單快照 $(ls snapshots/stable/*.json | tail -1 | xargs basename | sed 's/\.json$//')"
            git pull --rebase --autostash && git push || { echo "::warning::快照 commit 推送失敗"; exit 1; }
          fi

      # 只有「資料真的寫進倉儲」或「這次是從種子冷啟動」才存快取。
      # 放在最後、而且要求前面全部成功：產出被自我檢查擋下時，
      # 不該把可能有問題的倉儲存起來給下一次用。
      - name: 保存倉儲快取
        if: >-
          success() && (steps.fetch.outputs.changed == 'true'
          || steps.cache.outputs.cache-matched-key == '')
        uses: actions/cache/save@v4
        with:
          path: |
            data
            raw
          key: warehouse2008-${{ github.run_id }}

      - name: 摘要
        if: always()
        run: |
          {
            echo "### 這次更新（${{ github.event_name }}）"
            echo ""
            cat ci_summary.md 2>/dev/null || echo "（沒有產生摘要，代表在抓資料那步就停了）"
            echo ""
            echo "網址: ${{ steps.deploy.outputs.page_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
